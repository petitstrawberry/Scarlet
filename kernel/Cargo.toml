[package]
name = "scarlet"
version = "1.0.1"
edition = "2024"

[lib]
name = "scarlet"
path = "src/lib.rs"
doctest = false

[dependencies]
scarlet-abi = { path = "../user/lib/scarlet-abi" }
fdt = "0.1.5"
talc = "4.4"
hashbrown = "0.16.0"
lock_api = "0.4"
limine = { version = "0.6", optional = true }
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }

[features]
default = ["network", "user-fpu", "user-vector", "hypervisor", "limine"]
profiler = []
sync-debug = []
network = []
user-fpu = []
user-vector = []
hypervisor = []
limine = ["dep:limine"]
linux-boot = []

[package]
name = "scarlet-std-bin"
version = "0.1.0"
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
clap = { version = "4.5.32", features = ["derive"] }
csv = "1.3"
httparse = "1.9"
scarlet-os = { path = "../lib/scarlet-os" }
scarlet-sys = { path = "../lib/scarlet-sys" }
scarlet-ui = { path = "../lib/scarlet-ui", default-features = false, features = ["std"] }
scarlet-ui-macros = { path = "../lib/scarlet-ui-macros" }
rust_h264 = { git = "https://github.com/petitstrawberry/rust_h264.git", rev = "edcf83ee2c99fa0087fa2d85a492a4c313e11ed0", default-features = false }
url = "2.5"
ratatui = { version = "0.29", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.12"

[[bin]]
name = "hello"
path = "src/hello.rs"

[[bin]]
name = "cat"
path = "src/cat.rs"

[[bin]]
name = "ls"
path = "src/ls.rs"


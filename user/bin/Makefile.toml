[config]
default_to_workspace = false
skip_core_tasks = true

[env]
OSABI_VALUE = "83"
DIST_DIR = "dist/riscv64"
TARGET_SPEC = "../targets/riscv64gc-unknown-scarlet-elf.json"

[tasks.fmt]
description = "Format all user program code"
command = "cargo"
args = ["fmt"]

[tasks.fmt-check]
description = "Check formatting for all user program code"
command = "cargo"
args = ["fmt", "--", "--check"]

[tasks.clippy]
description = "Run clippy for all user programs"
command = "cargo"
args = ["clippy", "--", "-D", "warnings"]

[tasks.clippy-fix]
description = "Run clippy with auto-fix for all user programs"
command = "cargo"
args = ["clippy", "--fix", "--allow-dirty", "--allow-staged", "--", "-D", "warnings"]

[tasks.build]
description = "Build all user programs with OSABI=83 (debug mode)"
dependencies = ["build-only-debug", "set-osabi-debug", "split-debug-symbols"]

[tasks.build-release]
description = "Build all user programs with OSABI=83 (release mode)"
dependencies = ["build-only-release", "set-osabi-release"]

[tasks.build-only]
description = "Build user programs without OSABI setting (debug, internal)"
dependencies = ["build-only-debug"]

[tasks.build-only-debug]
description = "Build user programs in debug mode without OSABI setting (internal)"
script = 'cargo build --target "${TARGET_SPEC}" --out-dir "${DIST_DIR}"'

[tasks.build-only-release]
description = "Build user programs in release mode without OSABI setting (internal)"
script = 'cargo build --release --target "${TARGET_SPEC}" --out-dir "${DIST_DIR}"'

[tasks.build-aarch64]
description = "Build all user programs for AArch64 with OSABI=83 (debug mode)"
dependencies = ["build-only-debug-aarch64", "set-osabi-debug-aarch64", "split-debug-symbols-aarch64"]

[tasks.build-release-aarch64]
description = "Build all user programs for AArch64 with OSABI=83 (release mode)"
dependencies = ["build-only-release-aarch64", "set-osabi-release-aarch64"]

[tasks.build-only-debug-aarch64]
description = "Build user programs for AArch64 in debug mode without OSABI setting (internal)"
env = { "DIST_DIR" = "dist/aarch64", "TARGET_SPEC" = "../targets/aarch64-unknown-scarlet-elf.json" }
script = [
    'rm -rf "${DIST_DIR}" && mkdir -p "${DIST_DIR}"',
    'cargo build --target "${TARGET_SPEC}" --out-dir "${DIST_DIR}"'
]

[tasks.build-only-release-aarch64]
description = "Build user programs for AArch64 in release mode without OSABI setting (internal)"
env = { "DIST_DIR" = "dist/aarch64", "TARGET_SPEC" = "../targets/aarch64-unknown-scarlet-elf.json" }
script = [
    'rm -rf "${DIST_DIR}" && mkdir -p "${DIST_DIR}"',
    'cargo build --release --target "${TARGET_SPEC}" --out-dir "${DIST_DIR}"'
]

[tasks.set-osabi-debug-aarch64]
description = "Set OSABI to 83 for all user program binaries (AArch64 debug)"
env = { "DIST_DIR" = "dist/aarch64" }
dependencies = ["build-only-debug-aarch64"]
script = '''
echo "Setting OSABI to ${OSABI_VALUE} for user programs..."
if [ ! -d "${DIST_DIR}" ]; then
    echo "Error: ${DIST_DIR} directory not found"
    exit 1
fi

for binary_path in "${DIST_DIR}"/*; do
    if [ -f "${binary_path}" ] && [ -x "${binary_path}" ]; then
        binary=$(basename "${binary_path}")
        echo "Setting OSABI for ${binary}"
        python3 ./set_osabi.py "${binary_path}" ${OSABI_VALUE}
    fi
done

binary_count=$(find "${DIST_DIR}" -type f -executable | wc -l)
if [ "$binary_count" -eq 0 ]; then
    echo "Warning: No executable binaries found in ${DIST_DIR}"
fi
'''

[tasks.set-osabi-release-aarch64]
description = "Set OSABI to 83 for all user program binaries (AArch64 release)"
env = { "DIST_DIR" = "dist/aarch64" }
dependencies = ["build-only-release-aarch64"]
script = '''
echo "Setting OSABI to ${OSABI_VALUE} for user programs..."
if [ ! -d "${DIST_DIR}" ]; then
    echo "Error: ${DIST_DIR} directory not found"
    exit 1
fi

for binary_path in "${DIST_DIR}"/*; do
    if [ -f "${binary_path}" ] && [ -x "${binary_path}" ]; then
        binary=$(basename "${binary_path}")
        echo "Setting OSABI for ${binary}"
        python3 ./set_osabi.py "${binary_path}" ${OSABI_VALUE}
    fi
done

binary_count=$(find "${DIST_DIR}" -type f -executable | wc -l)
if [ "$binary_count" -eq 0 ]; then
    echo "Warning: No executable binaries found in ${DIST_DIR}"
fi
'''

[tasks.set-osabi-debug]
description = "Set OSABI to 83 for all user program binaries (debug mode)"
dependencies = ["build-only-debug"]
script = '''
echo "Setting OSABI to ${OSABI_VALUE} for user programs..."
if [ ! -d "${DIST_DIR}" ]; then
    echo "Error: ${DIST_DIR} directory not found"
    exit 1
fi

# Find all executable files in the dist directory
for binary_path in "${DIST_DIR}"/*; do
    if [ -f "${binary_path}" ] && [ -x "${binary_path}" ]; then
        binary=$(basename "${binary_path}")
        echo "Setting OSABI for ${binary}"
        python3 ./set_osabi.py "${binary_path}" ${OSABI_VALUE}
    fi
done

# Check if any binaries were processed
binary_count=$(find "${DIST_DIR}" -type f -executable | wc -l)
if [ "$binary_count" -eq 0 ]; then
    echo "Warning: No executable binaries found in ${DIST_DIR}"
fi
'''

[tasks.set-osabi-release]
description = "Set OSABI to 83 for all user program binaries (release mode)"
dependencies = ["build-only-release"]
script = '''
echo "Setting OSABI to ${OSABI_VALUE} for user programs..."
if [ ! -d "${DIST_DIR}" ]; then
    echo "Error: ${DIST_DIR} directory not found"
    exit 1
fi
# Find all executable files in the dist directory
for binary_path in "${DIST_DIR}"/*; do
    if [ -f "${binary_path}" ] && [ -x "${binary_path}" ]; then
        binary=$(basename "${binary_path}")
        echo "Setting OSABI for ${binary}"
        python3 ./set_osabi.py "${binary_path}" ${OSABI_VALUE}
    fi
done

# Check if any binaries were processed
binary_count=$(find "${DIST_DIR}" -type f -executable | wc -l)
if [ "$binary_count" -eq 0 ]; then
    echo "Warning: No executable binaries found in ${DIST_DIR}"
fi
'''

[tasks.verify-osabi]
description = "Verify OSABI settings for all binaries"
script = '''
echo "Verifying OSABI settings..."
if [ ! -d "${DIST_DIR}" ]; then
    echo "Error: ${DIST_DIR} directory not found"
    exit 1
fi

# Find all executable files in the dist directory
found_binaries=false
for binary_path in "${DIST_DIR}"/*; do
    if [ -f "${binary_path}" ] && [ -x "${binary_path}" ]; then
        binary=$(basename "${binary_path}")
        echo -n "${binary}: "
        od -t u1 -N 1 -j 7 "${binary_path}" | awk 'NR==1 {print $2}'
        found_binaries=true
    fi
done

if [ "$found_binaries" = false ]; then
    echo "No executable binaries found in ${DIST_DIR}"
fi
'''

[tasks.split-debug-symbols]
description = "Split debug symbols for user programs (riscv64 debug)"
env = { "DEBUG_DIR" = "dist/riscv64.debug", "DIST_DIR" = "dist/riscv64" }
script = '''
if [ ! -d "${DIST_DIR}" ]; then
    echo "Error: ${DIST_DIR} directory not found"
    exit 1
fi

if command -v llvm-objcopy >/dev/null 2>&1; then
    OBJCOPY=llvm-objcopy
elif command -v riscv64-unknown-elf-objcopy >/dev/null 2>&1; then
    OBJCOPY=riscv64-unknown-elf-objcopy
elif command -v riscv64-linux-gnu-objcopy >/dev/null 2>&1; then
    OBJCOPY=riscv64-linux-gnu-objcopy
else
    echo "Error: objcopy not found for RISC-V"
    exit 1
fi

mkdir -p "${DEBUG_DIR}"

for binary_path in "${DIST_DIR}"/*; do
    if [ -f "${binary_path}" ] && [ -x "${binary_path}" ]; then
        binary=$(basename "${binary_path}")
        debug_file="${DEBUG_DIR}/${binary}.debug"
        "$OBJCOPY" --only-keep-debug "${binary_path}" "${debug_file}"
        "$OBJCOPY" --strip-debug --strip-unneeded "${binary_path}"
        "$OBJCOPY" --add-gnu-debuglink="${debug_file}" "${binary_path}"
    fi
done
'''

[tasks.split-debug-symbols-aarch64]
description = "Split debug symbols for user programs (aarch64 debug)"
env = { "DEBUG_DIR" = "dist/aarch64.debug", "DIST_DIR" = "dist/aarch64" }
script = '''
if [ ! -d "${DIST_DIR}" ]; then
    echo "Error: ${DIST_DIR} directory not found"
    exit 1
fi

if command -v llvm-objcopy >/dev/null 2>&1; then
    OBJCOPY=llvm-objcopy
elif command -v aarch64-linux-gnu-objcopy >/dev/null 2>&1; then
    OBJCOPY=aarch64-linux-gnu-objcopy
else
    echo "Error: objcopy not found for AArch64"
    exit 1
fi

mkdir -p "${DEBUG_DIR}"

for binary_path in "${DIST_DIR}"/*; do
    if [ -f "${binary_path}" ] && [ -x "${binary_path}" ]; then
        binary=$(basename "${binary_path}")
        debug_file="${DEBUG_DIR}/${binary}.debug"
        "$OBJCOPY" --only-keep-debug "${binary_path}" "${debug_file}"
        "$OBJCOPY" --strip-debug --strip-unneeded "${binary_path}"
        "$OBJCOPY" --add-gnu-debuglink="${debug_file}" "${binary_path}"
    fi
done
'''

[tasks.clean]
description = "Clean build artifacts"
command = "cargo"
args = ["clean"]

[tasks.test-osabi]
description = "Test OSABI setting with a single binary"
script = '''
if [ "$#" -eq 0 ]; then
    echo "Usage: cargo make test-osabi -- <binary_name>"
    exit 1
fi
BINARY_NAME="$1"
BINARY_PATH="${DIST_DIR}/${BINARY_NAME}"

if [ -f "${BINARY_PATH}" ]; then
    echo "Current OSABI for ${BINARY_NAME}:"
    od -t u1 -N 1 -j 7 "${BINARY_PATH}" | awk 'NR==1 {print $2}'
    python3 ./set_osabi.py "${BINARY_PATH}" ${OSABI_VALUE}
    echo "New OSABI for ${BINARY_NAME}:"
    od -t u1 -N 1 -j 7 "${BINARY_PATH}" | awk 'NR==1 {print $2}'
else
    echo "Binary ${BINARY_NAME} not found in ${DIST_DIR}"
    exit 1
fi
'''

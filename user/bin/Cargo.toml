[package]
name = "userprogram"
version = "0.15.0"
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[[bin]]
name = "init"
path = "src/init.rs"

[[bin]]
name = "login"
path = "src/login.rs"

[[bin]]
name = "sh"
path = "src/sh/main.rs"

[[bin]]
name = "ls"
path = "src/ls.rs"

[[bin]]
name = "rm"
path = "src/rm.rs"

[[bin]]
name = "hello"
path = "src/hello.rs"

[[bin]]
name = "test"
path = "src/test.rs"

[[bin]]
name = "xv6"
path = "src/xv6.rs"

[[bin]]
name = "env_test"
path = "src/env_test.rs"

[[bin]]
name = "cat"
path = "src/cat.rs"

[[bin]]
name = "fb_test"
path = "src/fb_test.rs"

[[bin]]
name = "socket_server"
path = "src/socket_server.rs"

[[bin]]
name = "socket_client"
path = "src/socket_client.rs"

[[bin]]
name = "socket_pair"
path = "src/socket_pair.rs"

[[bin]]
name = "window_server"
path = "src/window_server.rs"

[[bin]]
name = "sws"
path = "src/sws/main.rs"

[[bin]]
name = "container_demo"
path = "src/container_demo.rs"

[[bin]]
name = "socket_handle_transfer_demo"
path = "src/socket_handle_transfer_demo.rs"
test = false

[[bin]]
name = "ui_demo"
path = "src/ui_demo.rs"

[[bin]]
name = "stemd"
path = "src/stemd/main.rs"

[[bin]]
name = "sbusd"
path = "src/sbusd/main.rs"

# [[bin]]
# name = "slint_demo"
# path = "src/slint_demo.rs"

[[bin]]
name = "scarlet_desktop"
path = "src/scarlet_desktop/main.rs"

[[bin]]
name = "scarlet_desktop_background"
path = "src/scarlet_desktop/background/main.rs"

[[bin]]
name = "scarlet_desktop_taskbar"
path = "src/scarlet_desktop/taskbar/main.rs"

[[bin]]
name = "scarlet_desktop_overview"
path = "src/scarlet_desktop/overview/main.rs"

[[bin]]
name = "scarlet_desktop_settings"
path = "src/scarlet_desktop/settings/main.rs"

[[bin]]
name = "scarlet_desktop_terminal"
path = "src/scarlet_desktop/terminal/main.rs"

[[bin]]
name = "scarlet_desktop_notepad"
path = "src/scarlet_desktop/notepad/main.rs"

[[bin]]
name = "scarlet_desktop_filer"
path = "src/scarlet_desktop/filer/main.rs"

[[bin]]
name = "scarlet_desktop_launcher"
path = "src/scarlet_desktop/launcher/main.rs"

[[bin]]
name = "scarlet_desktop_clock"
path = "src/scarlet_desktop/clock/main.rs"

[[bin]]
name = "scarlet-ui-counter"
path = "src/scarlet-ui-examples/counter.rs"

[dependencies]
scarlet_std = { path = "../lib/std", features = ["alloc_debug"] }
framebuffer = { path = "../lib/framebuffer" }
sws_protocol = { path = "../lib/sws_protocol" }
sws-client = { path = "../lib/sws-client" }
scarlet-ui = { path = "../lib/scarlet-ui" }
# slint-scarlet = { path = "../lib/slint-scarlet" }
scarlet-desktop-config = { path = "../lib/scarlet-desktop-config" }
sbus = { path = "../lib/sbus" }
sbus-client = { path = "../lib/sbus-client" }
slint = { version = "1.14", default-features = false, features = [
    "unsafe-single-threaded",
    "renderer-software",
    "libm",
    "compat-1-2"
] }

[build-dependencies]
slint-build = "1.14"

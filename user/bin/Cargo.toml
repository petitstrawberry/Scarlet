[package]
name = "userprogram"
version = "0.16.0"
edition = "2024"

[features]
default = ["mp4-aac"]
mp4-aac = ["dep:symphonia-core", "dep:symphonia-codec-aac"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[[bin]]
name = "init"
path = "src/init.rs"

[[bin]]
name = "microvm_init"
path = "src/microvm_init.rs"

[[bin]]
name = "login"
path = "src/login.rs"

[[bin]]
name = "sh"
path = "src/sh/main.rs"

[[bin]]
name = "test"
path = "src/test.rs"

[[bin]]
name = "xv6"
path = "src/xv6.rs"

[[bin]]
name = "fb_test"
path = "src/fb_test.rs"

[[bin]]
name = "gpu_probe"
path = "src/gpu_probe.rs"

 [[bin]]
 name = "socket_server"
 path = "src/socket_server.rs"

[[bin]]
name = "socket_client"
path = "src/socket_client.rs"

[[bin]]
name = "socket_pair"
path = "src/socket_pair.rs"

[[bin]]
name = "ping"
path = "src/ping.rs"

[[bin]]
name = "pdfview"
path = "src/pdfview.rs"

[[bin]]
name = "netcfg"
path = "src/netcfg.rs"

[[bin]]
name = "netcfgd"
path = "src/netcfgd/main.rs"

[[bin]]
name = "sws"
path = "src/sws/main.rs"

[[bin]]
name = "container_demo"
path = "src/container_demo.rs"

[[bin]]
name = "socket_handle_transfer_demo"
path = "src/socket_handle_transfer_demo.rs"
test = false

# [[bin]]
# name = "ui_demo"
# path = "src/ui_demo.rs"

[[bin]]
name = "stemd"
path = "src/stemd/main.rs"

[[bin]]
name = "sbusd"
path = "src/sbusd/main.rs"

[[bin]]
name = "scarlet_desktop"
path = "src/scarlet_desktop/main.rs"

[[bin]]
name = "scarlet_desktop_background"
path = "src/scarlet_desktop/background/main.rs"

[[bin]]
name = "scarlet_desktop_taskbar"
path = "src/scarlet_desktop/taskbar/scarlet_ui.rs"

[[bin]]
name = "terminal"
path = "src/terminal/main.rs"

[[bin]]
name = "ui-demo"
path = "src/ui_demo.rs"

[[bin]]
name = "wayland_bridge"
path = "src/wayland_bridge/main.rs"

[[bin]]
name = "event_demo"
path = "src/event_demo.rs"

[[bin]]
name = "scarlet_skk"
path = "src/scarlet_skk.rs"

[[bin]]
name = "scarlet_mozc"
path = "src/scarlet_mozc.rs"

[[bin]]
name = "mozc_server"
path = "src/mozc_server.rs"

[[bin]]
name = "settings"
path = "src/settings.rs"

[[bin]]
name = "shutdown"
path = "src/shutdown.rs"

[[bin]]
name = "scpm"
path = "src/scpm.rs"

[[bin]]
name = "ushv"
path = "src/ushv/main.rs"

[[bin]]
name = "ps"
path = "src/ps.rs"

[[bin]]
name = "pty_smoke"
path = "src/pty_smoke.rs"

[[bin]]
name = "mplayer"
path = "src/mplayer.rs"

[[bin]]
name = "video_player"
path = "src/video_player.rs"

[[bin]]
name = "sas"
path = "src/sas/main.rs"

[dependencies]
scarlet-std = { path = "../lib/std", features = ["alloc_debug"] }
scpm = { path = "../lib/scpm" }
framebuffer = { path = "../lib/framebuffer" }
gpu = { path = "../lib/gpu" }
sws-protocol = { path = "../lib/sws-protocol" }
sws-client = { path = "../lib/sws-client" }
scarlet-os = { path = "../lib/scarlet-os" }
scarlet-codecs = { path = "../lib/scarlet-codecs" }
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", package = "scarlet-ui", default-features = false, features = ["legacy-scarlet-std", "platform-sws"] }
scarlet-ui-macros = { git = "https://github.com/petitstrawberry/scarlet-ui", package = "scarlet-ui-macros" }
scarlet-desktop-config = { path = "../lib/scarlet-desktop-config" }
sbus = { path = "../lib/sbus" }
sbus-client = { path = "../lib/sbus-client" }
sas-protocol = { path = "../lib/sas-protocol", default-features = false, features = ["legacy-scarlet-std"] }
sas-client = { path = "../lib/sas-client", default-features = false, features = ["legacy-scarlet-std"] }
vm-fdt = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde-json-core = { package = "serde-json-core", version = "0.6", default-features = false }
rust_h264 = { git = "https://github.com/petitstrawberry/rust_h264.git", rev = "a559fe2545fd88def12146dcc06286475b53ead3", default-features = false, features = ["portable-simd"] }
symphonia-core = { git = "https://github.com/petitstrawberry/Symphonia.git", rev = "71f92f0bc0fdd9d4f2a77129a543ee6c99611009", default-features = false, optional = true }
symphonia-codec-aac = { git = "https://github.com/petitstrawberry/Symphonia.git", rev = "71f92f0bc0fdd9d4f2a77129a543ee6c99611009", default-features = false, optional = true }

[patch."https://github.com/petitstrawberry/Scarlet"]
scarlet-abi = { path = "../lib/scarlet-abi" }
scarlet-os = { path = "../lib/scarlet-os" }
scarlet-rt = { path = "../lib/scarlet-rt" }
scarlet-std = { path = "../lib/std" }
scarlet-sys = { path = "../lib/scarlet-sys" }
sws-client = { path = "../lib/sws-client" }
sws-protocol = { path = "../lib/sws-protocol" }

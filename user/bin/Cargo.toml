[package]
name = "userprogram"
version = "0.16.0"
edition = "2024"
workspace = "../../.cargo"

# User-facing executable names use kebab-case. Rust source paths stay snake_case.

[[bin]]
name = "init"
path = "src/init.rs"

[[bin]]
name = "microvm-init"
path = "src/microvm_init.rs"

[[bin]]
name = "login"
path = "src/login.rs"

[[bin]]
name = "sh"
path = "src/sh/main.rs"

[[bin]]
name = "test"
path = "src/test.rs"

[[bin]]
name = "xv6"
path = "src/xv6.rs"

[[bin]]
name = "fb-test"
path = "src/fb_test.rs"

[[bin]]
name = "sgfx-probe"
path = "src/sgfx_probe.rs"

[[bin]]
name = "dcp-flip-test"
path = "src/dcp_flip_test.rs"

[[bin]]
name = "socket-server"
path = "src/socket_server.rs"

[[bin]]
name = "socket-client"
path = "src/socket_client.rs"

[[bin]]
name = "socket-pair"
path = "src/socket_pair.rs"

[[bin]]
name = "ping"
path = "src/ping.rs"

[[bin]]
name = "pdfview"
path = "src/pdfview.rs"

[[bin]]
name = "netcfg"
path = "src/netcfg.rs"

[[bin]]
name = "netcfgd"
path = "src/netcfgd/main.rs"

[[bin]]
name = "container-demo"
path = "src/container_demo.rs"

[[bin]]
name = "socket-handle-transfer-demo"
path = "src/socket_handle_transfer_demo.rs"
test = false

# [[bin]]
# name = "ui-demo"
# path = "src/ui_demo.rs"

[[bin]]
name = "sbusd"
path = "src/sbusd/main.rs"

[[bin]]
name = "scarlet-desktop"
path = "src/scarlet_desktop/main.rs"

[[bin]]
name = "desktop-settings"
path = "src/scarlet_desktop/settingsd.rs"

[[bin]]
name = "terminal"
path = "src/terminal/main.rs"

[[bin]]
name = "ui-demo"
path = "src/ui_demo.rs"

[[bin]]
name = "ui-benchmark"
path = "src/ui_benchmark.rs"

[[bin]]
name = "wayland-bridge"
path = "src/wayland_bridge/main.rs"

[[bin]]
name = "event-demo"
path = "src/event_demo.rs"

[[bin]]
name = "scarlet-skk"
path = "src/scarlet_skk.rs"

[[bin]]
name = "scarlet-mozc"
path = "src/scarlet_mozc.rs"

[[bin]]
name = "mozc-server"
path = "src/mozc_server.rs"

[[bin]]
name = "settings"
path = "src/settings.rs"

[[bin]]
name = "shutdown"
path = "src/shutdown.rs"

[[bin]]
name = "scpm"
path = "src/scpm.rs"

[[bin]]
name = "ushv"
path = "src/ushv/main.rs"

[[bin]]
name = "ps"
path = "src/ps.rs"

[[bin]]
name = "pty-smoke"
path = "src/pty_smoke.rs"

[[bin]]
name = "sshd"
path = "src/sshd/main.rs"

[[bin]]
name = "mplayer"
path = "src/mplayer.rs"

[[bin]]
name = "sas"
path = "src/sas/main.rs"

[dependencies]
scarlet-std = { path = "../lib/std", features = ["alloc_debug"] }
scpm = { path = "../lib/scpm" }
framebuffer = { path = "../lib/framebuffer" }
sgfx = { path = "../lib/sgfx-frontend", default-features = false, features = ["legacy-scarlet-std"] }
sws-protocol = { path = "../lib/sws-protocol" }
sws-client = { path = "../lib/sws-client" }
scarlet-os = { path = "../lib/scarlet-os" }
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", package = "scarlet-ui", default-features = false, features = ["legacy-scarlet-std", "platform-sws"] }
scarlet-ui-macros = { git = "https://github.com/petitstrawberry/scarlet-ui", package = "scarlet-ui-macros" }
scarlet-desktop-config = { path = "../lib/scarlet-desktop-config" }
scarlet-sys = { path = "../lib/scarlet-sys" }
sunset = { path = "../lib/sunset", default-features = false, features = ["larger", "mlkem", "openssh-key", "rsa"] }
getrandom = { version = "0.2.16", default-features = false, features = ["custom"] }
ssh-key = { version = "0.6.7", default-features = false, features = ["ed25519", "rsa"] }
rand_core = { version = "0.6.4", default-features = false, features = ["getrandom"] }
bcrypt = { version = "0.15.1", default-features = false }
hmac = { version = "0.12.1", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
subtle = { version = "2.6.1", default-features = false }
sbus = { path = "../lib/sbus" }
sbus-client = { path = "../lib/sbus-client" }
sas-protocol = { path = "../lib/sas-protocol", default-features = false, features = ["legacy-scarlet-std"] }
sas-client = { path = "../lib/sas-client", default-features = false, features = ["legacy-scarlet-std"] }
vm-fdt = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde-json-core = { package = "serde-json-core", version = "0.6", default-features = false }
libm = { version = "0.2", default-features = false }

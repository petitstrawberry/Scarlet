[package]
name = "scarlet-app-demo"
version = "0.1.0"
edition = "2024"
workspace = "../../.cargo"

[[bin]]
name = "app-demo"
path = "src/main.rs"

[build-dependencies]
toml = "0.8"

[target.'cfg(target_os = "scarlet")'.dependencies]
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "24b3f572128e4142e45833edb6ee77afb21507bf", default-features = false, features = ["std", "platform-sws"] }

[target.'cfg(not(target_os = "scarlet"))'.dependencies]
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "24b3f572128e4142e45833edb6ee77afb21507bf", default-features = false, features = ["std", "platform-winit"] }

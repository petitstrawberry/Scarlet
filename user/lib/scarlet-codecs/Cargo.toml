[package]
name = "scarlet-codecs"
version = "1.0.0"
edition = "2024"
description = "Userspace codec request builders for Scarlet stateless video decode"
readme = "README.md"

[features]
default = []
# H.264/AVC can be patent-encumbered in some jurisdictions. Keep it opt-in.
h264 = []
vp9 = []
# Software AVC/AAC playback is opt-in, including the same AVC licensing policy.
media-container-aac = ["h264", "dep:symphonia-core", "dep:symphonia-codec-aac", "dep:symphonia-format-isomp4", "dep:symphonia-std"]
software-h264 = ["media-container-aac", "dep:rust_h264"]
software-media = ["software-h264"]

[package.metadata.scarlet-codecs]
h264_patent_notice = "The h264 feature is disabled by default because H.264/AVC may be patent-encumbered in some jurisdictions."

[lib]
name = "scarlet_codecs"
path = "src/lib.rs"

[dependencies]
rust_h264 = { git = "https://github.com/petitstrawberry/rust_h264", rev = "ed481be3d733382529cc555b5393224adcc6acc0", optional = true, default-features = false, features = ["portable-simd"] }
symphonia-core = { git = "https://github.com/petitstrawberry/Symphonia", rev = "a178babb44462f002ec855b57e26abd57e106c36", optional = true, default-features = false }
symphonia-codec-aac = { git = "https://github.com/petitstrawberry/Symphonia", rev = "a178babb44462f002ec855b57e26abd57e106c36", optional = true, default-features = false }
symphonia-format-isomp4 = { git = "https://github.com/petitstrawberry/Symphonia", rev = "a178babb44462f002ec855b57e26abd57e106c36", optional = true, default-features = false }
symphonia-std = { git = "https://github.com/petitstrawberry/Symphonia", rev = "a178babb44462f002ec855b57e26abd57e106c36", optional = true, default-features = false, features = ["std"] }

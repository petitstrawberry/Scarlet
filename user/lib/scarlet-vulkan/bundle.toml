# Native Vulkan package: SDK-managed Cargo artifacts and runtime resources.
# GLFW and the ICD must share this SWS client connection.
[[layers]]
kind = "cargo"
source = "../sws-client-c"
package = "sws-client-c"
lib = "sws_client_c"
architectures = ["aarch64"]
to = "/lib/libsws_client_c.so"

# Standard Window chrome for native hosts with externally rendered content.
[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "da5ab44c9a41599f925dc84bb4fb55709bf83d84" }
package = "scarlet-ui-window-c"
lib = "scarlet_ui_window"
architectures = ["aarch64"]
to = "/lib/libscarlet_ui_window.so"

[[layers]]
kind = "bundle"
source = { git = "https://github.com/petitstrawberry/Vulkan-Loader", rev = "83f0038b735f08e9a8282ef37b74e1eab1fbf896" }
subdir = "native"

[[layers]]
kind = "cargo"
# Keep this SGFX revision aligned with bundles/sgfx-native/bundle.toml.
source = { git = "https://github.com/petitstrawberry/sgfx", rev = "f25a6db371998cb5460db637415084558e3be4fa" }
package = "vulkan-sgfx"
lib = "vulkan_sgfx"
default-features = false
architectures = ["aarch64"]
to = "/lib/libvulkan_sgfx.so"

[[layers]]
kind = "script"
source = "install-runtime.sh"
to = "/"

[package]
name = "framebuffer"
version = "0.16.0"
edition = "2021"

[features]
default = ["scarlet-std"]
std = ["dep:scarlet-os"]

[dependencies]
scarlet-os = { path = "../scarlet-os", default-features = false, features = ["std"], optional = true }
scarlet-std = { path = "../std", optional = true }

[lib]
name = "framebuffer"
path = "src/lib.rs"

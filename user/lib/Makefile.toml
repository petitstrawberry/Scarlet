[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true

[config]
default_task = "build-userlib"
skip_core_tasks = true

[tasks.fmt]
description = "Format all user library code"
dependencies = ["fmt-scarlet-abi", "fmt-scarlet-sys", "fmt-scarlet-rt", "fmt-scarlet-os", "fmt-std", "fmt-framebuffer", "fmt-gpu", "fmt-sws-protocol", "fmt-scarlet-desktop-config", "fmt-scpm"]

[tasks.fmt-check]
description = "Check formatting for all user library code"
dependencies = ["fmt-scarlet-abi-check", "fmt-scarlet-sys-check", "fmt-scarlet-rt-check", "fmt-scarlet-os-check", "fmt-std-check", "fmt-framebuffer-check", "fmt-gpu-check", "fmt-sws-protocol-check", "fmt-scpm-check"]

[tasks.fmt-scarlet-abi-check]
description = "Check formatting for Scarlet ABI code"
cwd = "scarlet-abi"
command = "cargo"
args = ["fmt", "--", "--check"]

[tasks.fmt-scarlet-sys-check]
description = "Check formatting for Scarlet syscall binding code"
cwd = "scarlet-sys"
command = "cargo"
args = ["fmt", "--", "--check"]

[tasks.fmt-scarlet-rt-check]
description = "Check formatting for Scarlet runtime code"
cwd = "scarlet-rt"
command = "cargo"
args = ["fmt", "--", "--check"]

[tasks.fmt-scarlet-os-check]
description = "Check formatting for Scarlet OS wrapper code"
cwd = "scarlet-os"
command = "cargo"
args = ["fmt", "--", "--check"]

[tasks.fmt-std-check]
description = "Check formatting for user library std code"
cwd = "std"
command = "cargo"
args = ["fmt", "--", "--check"]

[tasks.fmt-framebuffer-check]
description = "Check formatting for user library framebuffer code"
cwd = "framebuffer"
command = "cargo"
args = ["fmt", "--", "--check"]

[tasks.fmt-gpu-check]
description = "Check formatting for user library gpu code"
cwd = "gpu"
command = "cargo"
args = ["fmt", "--", "--check"]

[tasks.fmt-sws-protocol-check]
description = "Check formatting for user library sws-protocol code"
cwd = "sws-protocol"
command = "cargo"
args = ["fmt", "--", "--check"]

[tasks.fmt-std]
description = "Format user library std code"
cwd = "std"
command = "cargo"
args = ["fmt"]

[tasks.fmt-scarlet-abi]
description = "Format Scarlet ABI code"
cwd = "scarlet-abi"
command = "cargo"
args = ["fmt"]

[tasks.fmt-scarlet-sys]
description = "Format Scarlet syscall binding code"
cwd = "scarlet-sys"
command = "cargo"
args = ["fmt"]

[tasks.fmt-scarlet-rt]
description = "Format Scarlet runtime code"
cwd = "scarlet-rt"
command = "cargo"
args = ["fmt"]

[tasks.fmt-scarlet-os]
description = "Format Scarlet OS wrapper code"
cwd = "scarlet-os"
command = "cargo"
args = ["fmt"]

[tasks.fmt-framebuffer]
description = "Format user library framebuffer code"
cwd = "framebuffer"
command = "cargo"
args = ["fmt"]

[tasks.fmt-gpu]
description = "Format user library gpu code"
cwd = "gpu"
command = "cargo"
args = ["fmt"]

[tasks.fmt-sws-protocol]
description = "Format user library sws-protocol code"
cwd = "sws-protocol"
command = "cargo"
args = ["fmt"]

[tasks.fmt-scarlet-desktop-config]
description = "Format user library scarlet-desktop-config code"
cwd = "scarlet-desktop-config"
command = "cargo"
args = ["fmt"]

[tasks.fmt-scpm]
description = "Format user library scpm code"
cwd = "scpm"
command = "cargo"
args = ["fmt"]

[tasks.fmt-scpm-check]
description = "Check formatting for user library scpm code"
cwd = "scpm"
command = "cargo"
args = ["fmt", "--", "--check"]

[tasks.build-userlib]
description = "Build all user libraries (default: debug)"
dependencies = ["build-userlib-debug"]

[tasks.build-userlib-debug]
description = "Build all user libraries in debug mode"
script = [
    "cd scarlet-abi && cargo build --target ../../targets/riscv64gc-unknown-scarlet-elf.json",
    "cd ../scarlet-sys && cargo build --target ../../targets/riscv64gc-unknown-scarlet-elf.json",
    "cd ../scarlet-rt && cargo build --target ../../targets/riscv64gc-unknown-scarlet-elf.json",
    "cd ../scarlet-os && cargo build --target ../../targets/riscv64gc-unknown-scarlet-elf.json",
    "cd ../std && cargo build --target ../../targets/riscv64gc-unknown-scarlet-elf.json",
    "cd ../framebuffer && cargo build --target ../../targets/riscv64gc-unknown-scarlet-elf.json",
    "cd ../gpu && cargo build --target ../../targets/riscv64gc-unknown-scarlet-elf.json",
    "cd ../sws-protocol && cargo build --target ../../targets/riscv64gc-unknown-scarlet-elf.json",
    "cd ../scarlet-desktop-config && cargo build --target ../../targets/riscv64gc-unknown-scarlet-elf.json",
    "cd ../scpm && cargo build --target ../../targets/riscv64gc-unknown-scarlet-elf.json"
]

[tasks.build-userlib-release]
description = "Build all user libraries in release mode"
script = [
    "cd scarlet-abi && cargo build --release --target ../../targets/riscv64gc-unknown-scarlet-elf.json",
    "cd ../scarlet-sys && cargo build --release --target ../../targets/riscv64gc-unknown-scarlet-elf.json",
    "cd ../scarlet-rt && cargo build --release --target ../../targets/riscv64gc-unknown-scarlet-elf.json",
    "cd ../scarlet-os && cargo build --release --target ../../targets/riscv64gc-unknown-scarlet-elf.json",
    "cd ../std && cargo build --release --target ../../targets/riscv64gc-unknown-scarlet-elf.json",
    "cd ../framebuffer && cargo build --release --target ../../targets/riscv64gc-unknown-scarlet-elf.json",
    "cd ../gpu && cargo build --release --target ../../targets/riscv64gc-unknown-scarlet-elf.json",
    "cd ../sws-protocol && cargo build --release --target ../../targets/riscv64gc-unknown-scarlet-elf.json",
    "cd ../scarlet-desktop-config && cargo build --release --target ../../targets/riscv64gc-unknown-scarlet-elf.json",
    "cd ../scpm && cargo build --release --target ../../targets/riscv64gc-unknown-scarlet-elf.json"
]

[tasks.build-userlib-debug-aarch64]
description = "Build all user libraries for AArch64 in debug mode"
script = [
    "cd scarlet-abi && cargo build --target ../../targets/aarch64-unknown-scarlet-elf.json",
    "cd ../scarlet-sys && cargo build --target ../../targets/aarch64-unknown-scarlet-elf.json",
    "cd ../scarlet-rt && cargo build --target ../../targets/aarch64-unknown-scarlet-elf.json",
    "cd ../scarlet-os && cargo build --target ../../targets/aarch64-unknown-scarlet-elf.json",
    "cd ../std && cargo build --target ../../targets/aarch64-unknown-scarlet-elf.json",
    "cd ../framebuffer && cargo build --target ../../targets/aarch64-unknown-scarlet-elf.json",
    "cd ../gpu && cargo build --target ../../targets/aarch64-unknown-scarlet-elf.json",
    "cd ../sws-protocol && cargo build --target ../../targets/aarch64-unknown-scarlet-elf.json",
    "cd ../scarlet-desktop-config && cargo build --target ../../targets/aarch64-unknown-scarlet-elf.json",
    "cd ../scpm && cargo build --target ../../targets/aarch64-unknown-scarlet-elf.json"
]

[tasks.build-userlib-release-aarch64]
description = "Build all user libraries for AArch64 in release mode"
script = [
    "cd scarlet-abi && cargo build --release --target ../../targets/aarch64-unknown-scarlet-elf.json",
    "cd ../scarlet-sys && cargo build --release --target ../../targets/aarch64-unknown-scarlet-elf.json",
    "cd ../scarlet-rt && cargo build --release --target ../../targets/aarch64-unknown-scarlet-elf.json",
    "cd ../scarlet-os && cargo build --release --target ../../targets/aarch64-unknown-scarlet-elf.json",
    "cd ../std && cargo build --release --target ../../targets/aarch64-unknown-scarlet-elf.json",
    "cd ../framebuffer && cargo build --release --target ../../targets/aarch64-unknown-scarlet-elf.json",
    "cd ../gpu && cargo build --release --target ../../targets/aarch64-unknown-scarlet-elf.json",
    "cd ../sws-protocol && cargo build --release --target ../../targets/aarch64-unknown-scarlet-elf.json",
    "cd ../scarlet-desktop-config && cargo build --release --target ../../targets/aarch64-unknown-scarlet-elf.json",
    "cd ../scpm && cargo build --release --target ../../targets/aarch64-unknown-scarlet-elf.json"
]

[tasks.clean]
description = "Clean all user library build artifacts"
script = [
    "cd scarlet-abi && cargo clean",
    "cd ../scarlet-sys && cargo clean",
    "cd ../scarlet-rt && cargo clean",
    "cd ../scarlet-os && cargo clean",
    "cd ../std && cargo clean",
    "cd ../framebuffer && cargo clean",
    "cd ../gpu && cargo clean",
    "cd ../sws-protocol && cargo clean",
    "cd ../sws-client && cargo clean",
    "cd ../sas-protocol && cargo clean",
    "cd ../sas-client && cargo clean",
    "cd ../sbus && cargo clean",
    "cd ../sbus-client && cargo clean",
    "cd ../scarlet-desktop-config && cargo clean",
    "cd ../scarlet-youtube-net && cargo clean",
    "cd ../slint-scarlet && cargo clean",
    "cd ../scpm && cargo clean"
]

[tasks.test]
description = "Test all user libraries"
script = [
    "cd std && cargo test",
    "cd ../framebuffer && cargo test",
    "cd ../gpu && cargo test",
    "cd ../sws-protocol && cargo test",
    "cd ../scarlet-desktop-config && cargo test",
    "cd ../scpm && cargo test"
]

[tasks.doc]
description = "Generate documentation for all user libraries"
script = [
    "cd scarlet-abi && cargo doc --no-deps",
    "cd ../scarlet-sys && cargo doc --no-deps",
    "cd ../scarlet-rt && cargo doc --no-deps",
    "cd ../scarlet-os && cargo doc --no-deps",
    "cd ../std && cargo doc --no-deps",
    "cd ../framebuffer && cargo doc --no-deps",
    "cd ../gpu && cargo doc --no-deps",
    "cd ../sws-protocol && cargo doc --no-deps",
    "cd ../scarlet-desktop-config && cargo doc --no-deps",
    "cd ../scpm && cargo doc --no-deps"
]

[tasks.clippy]
description = "Run clippy for all user libraries"
dependencies = ["clippy-scarlet-abi", "clippy-scarlet-sys", "clippy-scarlet-rt", "clippy-scarlet-os", "clippy-std", "clippy-framebuffer", "clippy-gpu", "clippy-sws-protocol", "clippy-scarlet-desktop-config", "clippy-scpm"]

[tasks.clippy-scarlet-abi]
description = "Run clippy for Scarlet ABI code"
cwd = "scarlet-abi"
command = "cargo"
args = ["clippy", "--", "-D", "warnings"]

[tasks.clippy-scarlet-sys]
description = "Run clippy for Scarlet syscall binding code"
cwd = "scarlet-sys"
command = "cargo"
args = ["clippy", "--", "-D", "warnings"]

[tasks.clippy-scarlet-rt]
description = "Run clippy for Scarlet runtime code"
cwd = "scarlet-rt"
command = "cargo"
args = ["clippy", "--", "-D", "warnings"]

[tasks.clippy-scarlet-os]
description = "Run clippy for Scarlet OS wrapper code"
cwd = "scarlet-os"
command = "cargo"
args = ["clippy", "--", "-D", "warnings"]

[tasks.clippy-std]
description = "Run clippy for user library std code"
cwd = "std"
command = "cargo"
args = ["clippy", "--", "-D", "warnings"]

[tasks.clippy-framebuffer]
description = "Run clippy for user library framebuffer code"
cwd = "framebuffer"
command = "cargo"
args = ["clippy", "--", "-D", "warnings"]

[tasks.clippy-gpu]
description = "Run clippy for user library gpu code"
cwd = "gpu"
command = "cargo"
args = ["clippy", "--", "-D", "warnings"]

[tasks.clippy-sws-protocol]
description = "Run clippy for user library sws-protocol code"
cwd = "sws-protocol"
command = "cargo"
args = ["clippy", "--", "-D", "warnings"]

[tasks.clippy-scarlet-desktop-config]
description = "Run clippy for user library scarlet-desktop-config code"
cwd = "scarlet-desktop-config"
command = "cargo"
args = ["clippy", "--", "-D", "warnings"]

[tasks.clippy-scpm]
description = "Run clippy for user library scpm code"
cwd = "scpm"
command = "cargo"
args = ["clippy", "--", "-D", "warnings"]

[tasks.clippy-fix]
description = "Run clippy with auto-fix for all user libraries"
dependencies = ["clippy-fix-scarlet-abi", "clippy-fix-scarlet-sys", "clippy-fix-scarlet-rt", "clippy-fix-scarlet-os", "clippy-fix-std", "clippy-fix-framebuffer", "clippy-fix-gpu", "clippy-fix-sws-protocol", "clippy-fix-scarlet-desktop-config", "clippy-fix-scpm"]

[tasks.clippy-fix-scarlet-abi]
description = "Run clippy with auto-fix for Scarlet ABI code"
cwd = "scarlet-abi"
command = "cargo"
args = ["clippy", "--fix", "--allow-dirty", "--allow-staged", "--", "-D", "warnings"]

[tasks.clippy-fix-scarlet-sys]
description = "Run clippy with auto-fix for Scarlet syscall binding code"
cwd = "scarlet-sys"
command = "cargo"
args = ["clippy", "--fix", "--allow-dirty", "--allow-staged", "--", "-D", "warnings"]

[tasks.clippy-fix-scarlet-rt]
description = "Run clippy with auto-fix for Scarlet runtime code"
cwd = "scarlet-rt"
command = "cargo"
args = ["clippy", "--fix", "--allow-dirty", "--allow-staged", "--", "-D", "warnings"]

[tasks.clippy-fix-scarlet-os]

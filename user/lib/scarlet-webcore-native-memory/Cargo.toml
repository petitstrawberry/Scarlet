[package]
name = "scarlet-webcore-native-memory"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
name = "scarlet_webcore_native_memory"
crate-type = ["staticlib"]

[dependencies]
scarlet-os = { path = "../scarlet-os", default-features = false, features = ["std"] }

[profile.release]
panic = "abort"

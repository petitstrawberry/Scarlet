[package]
name = "sws-client-c"
version = "1.0.0"
edition = "2024"

[lib]
name = "sws_client_c"
crate-type = ["cdylib", "staticlib"]

[dependencies]
sws-client = { path = "../sws-client", default-features = false, features = ["std"] }
scarlet-sys = { path = "../scarlet-sys" }

sws-protocol = { path = "../sws-protocol", default-features = false, features = ["std"] }
scarlet-os = { path = "../scarlet-os", default-features = false, features = ["std"] }

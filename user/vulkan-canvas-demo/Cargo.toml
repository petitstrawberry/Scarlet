[package]
name = "vulkan-canvas-demo"
version = "0.1.0"
edition = "2024"
workspace = "../../.cargo"
build = "build.rs"

[build-dependencies]
naga = { version = "24", features = ["wgsl-in", "spv-out"] }

[target.'cfg(target_os = "scarlet")'.dependencies]
ash = { version = "0.38", default-features = false, features = ["debug", "std"] }
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "8de1b3ca307341a35a0f6b001fdc885d22ba478b", default-features = false, features = ["std", "platform-sws"] }
vulkan-sgfx = { git = "https://github.com/petitstrawberry/sgfx", rev = "f4c098826ba4561fb705c2cf2ec8d506f235deec" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("scarlet"))'] }

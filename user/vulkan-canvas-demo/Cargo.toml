[package]
name = "vulkan-canvas-demo"
version = "0.1.0"
edition = "2024"
workspace = "../../.cargo"
build = "build.rs"

[build-dependencies]
naga = { version = "24", features = ["wgsl-in", "spv-out"] }

[target.'cfg(target_os = "scarlet")'.dependencies]
ash = { version = "0.38", default-features = false, features = ["debug", "std"] }
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "409b91758b67a0084f411b133c885a88e54b1461", default-features = false, features = ["std", "platform-sws"] }
sgfx = { git = "https://github.com/petitstrawberry/sgfx", rev = "0ee6b41669904ced227f01cc435933c646a60c75", default-features = false, features = ["std", "backend-dynamic"] }

[target.'cfg(all(target_os = "scarlet", target_arch = "aarch64"))'.dependencies]
scarlet-vulkan = { path = "../lib/scarlet-vulkan" }

# Preserve existing targets until the installed native loader is ported there.
[target.'cfg(all(target_os = "scarlet", not(target_arch = "aarch64")))'.dependencies]
vulkan-sgfx = { git = "https://github.com/petitstrawberry/sgfx", rev = "0ee6b41669904ced227f01cc435933c646a60c75" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("scarlet"))'] }

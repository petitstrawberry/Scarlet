# Network Configuration for netcfgd
# This directory contains TOML files that define network interface configurations
# Files are read in alphabetical order

# Example configuration for a static IP:
# [[interface]]
# name = "eth0"
# address = "192.168.1.100"
# netmask = "255.255.255.0"
# gateway = "192.168.1.1"
# dns = "8.8.8.8"

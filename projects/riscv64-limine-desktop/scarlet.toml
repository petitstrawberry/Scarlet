schema_version = 2

[project]
name = "scarlet-riscv64-limine-desktop"

[bsp]
path = "bsp"
package = "scarlet"

[bsp.kernel]
source = { path = "../../kernel" }
features = ["network", "user-fpu", "user-vector", "hypervisor", "limine"]

[modules]
"scarlet-module-prototype" = { path = "../../modules/scarlet-module-prototype", enabled = true }

[images]

[images.initramfs]
format = "newc"
output = ".scarlet/images/initramfs-riscv64-desktop.cpio"

[[images.initramfs.layers]]
kind = "bundle"
path = "../../bundles/base/bundle.toml"

[[images.initramfs.layers]]
kind = "bundle"
path = "../../bundles/cli-utils/bundle.toml"

[images.rootfs]
format = "ext2"
output = ".scarlet/images/rootfs-riscv64-desktop.ext2"

[[images.rootfs.layers]]
kind = "bundle"
path = "../../bundles/desktop/bundle.toml"

[images.boot]
format = "limine-uefi"
output = ".scarlet/images/limine-riscv64-desktop.img"
cmdline = "console=ttyS0 root=/dev/vblk1"
deps = ["initramfs"]

[[images.boot.layers]]
kind = "image"
source = "initramfs"
to = "/boot/initramfs"

[runner]
command = "tools/run.sh"

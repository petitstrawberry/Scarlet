schema_version = 2

[project]
name = "scarlet-aarch64-user-linux-minimum"

[bsp]
path = "bsp"
package = "scarlet"

[bsp.kernel]
source = { path = "../../kernel" }
features = { hosted = true, network = true, user-fpu = true, user-vector = true, hypervisor = false, limine = false }

[images.initramfs]
format = "newc"
output = ".scarlet/images/initramfs-aarch64-user-linux-minimum.cpio"

[[images.initramfs.layers]]
kind = "copy"
source = "initramfs"
to = "/"

[[images.initramfs.layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "init"
default-features = false
to = "/init"

[images.rootfs]
console-root = true
format = "ext2"
output = ".scarlet/images/rootfs-aarch64-user-linux-minimum.ext2"

[[images.rootfs.layers]]
kind = "bundle"
path = "../../bundles/base/bundle.toml"

[[images.rootfs.layers]]
kind = "bundle"
path = "../../bundles/cli-utils/bundle.toml"

[runner]
command = "tools/run_linux.sh"

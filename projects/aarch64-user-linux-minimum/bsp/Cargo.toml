[package]
name = "scarlet-aarch64-user-linux-minimum-bsp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
libc = "0.2"
scarlet = { path = "../../../kernel", default-features = false, features = ["hosted", "network", "user-fpu", "user-vector"] }
scarlet-hosted-runtime = { path = "../../../kernel/hosted/runtime" }

[[bin]]
name = "scarlet"
path = "src/main.rs"

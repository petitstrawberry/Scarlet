config_version = 1

[project]
name = "scarlet-aarch64-limine-microvm"

[board]
name = "aarch64-limine-microvm"
target = "aarch64-unknown-none-elf"
target_json = "../../kernel/targets/aarch64-unknown-none-elf.json"

[kernel]
package = "scarlet"
source = { path = "../../kernel" }

[kernel.features]
network = true
user-fpu = true
user-vector = true
hypervisor = true
limine = true
profiler = false

[modules]
"scarlet-module-prototype" = { path = "../../modules/scarlet-module-prototype", enabled = false }

[[image.steps]]
name = "initramfs"
kind = "archive.newc"
output = "{project}/.scarlet/images/initramfs-aarch64-microvm.cpio"

[[image.steps.inputs]]
source = "{project}/initramfs"
destination = "/"

[[image.steps.inputs]]
source = "{repo}/user/bin/dist/aarch64/microvm_init"
destination = "/system/scarlet/bin/init"

[[image.steps]]
name = "rootfs"
command = "{project}/tools/build_rootfs_ext2.sh"
args = [
    "{repo}/mkfs/rootfs",
    "{repo}/user/bin/dist/aarch64",
    "{repo}/mkfs/dist/modules/{target_triple}",
    "{project}/.scarlet/rootfs-stage",
    "{project}/.scarlet/images/rootfs-aarch64-microvm.ext2",
    "{project}/prebuilt",
]

[[image.steps]]
name = "limine-boot"
command = "cargo"
cwd = "{repo}"
args = [
    "run",
    "--manifest-path",
    "{repo}/cargo-scarlet-plugin-limine/Cargo.toml",
    "--",
    "--arch",
    "aarch64",
    "--kernel",
    "{kernel_elf}",
    "--initramfs",
    "{project}/.scarlet/images/initramfs-aarch64-microvm.cpio",
    "--output",
    "{project}/.scarlet/images/limine-aarch64-microvm.img",
    "--cmdline",
    "console=ttyAMA0",
    "--image-slack-mb",
    "8",
    "--limine-version",
    "11.0.0",
]

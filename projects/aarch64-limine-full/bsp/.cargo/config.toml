[profile.dev]
opt-level = 3

# Talc scans every free-list bin on each debug allocation and free while
# holding the IRQ-disabling heap lock. Keep other kernel debug checks and
# retain the whole-heap allocator checks in the test profile.
[profile.dev.package.talc]
debug-assertions = false

[profile.test]
opt-level = 3

[target.aarch64-unknown-none]
rustflags = ["-T", "lds/aarch64_limine.ld"]

[target.aarch64-unknown-none-elf]
rustflags = [
	"-C", "no-vectorize-loops",
	"-C", "no-vectorize-slp",
]

[build]
target = "../../../kernel/targets/aarch64-unknown-none-elf.json"

[unstable]
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]
unstable-options = true

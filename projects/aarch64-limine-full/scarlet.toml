schema_version = 2

[project]
name = "scarlet-aarch64-limine-full"

[kernel]
package = "scarlet"
source = "../../kernel"
target = "aarch64-unknown-none-elf"
target_json = "../../kernel/targets/aarch64-unknown-none-elf.json"

[kernel.features]
network = true
user-fpu = true
user-vector = true
hypervisor = true
limine = true
profiler = false

[modules]
"scarlet-module-prototype" = { path = "../../modules/scarlet-module-prototype", enabled = true }

[images]

[images.initramfs]
format = "newc"
output = ".scarlet/images/initramfs-aarch64-full.cpio"

[[images.initramfs.layers]]
path = "../../bundles/base/bundle.toml"

[[images.initramfs.layers]]
path = "../../bundles/cli-utils/bundle.toml"

[images.rootfs]
format = "ext2"
output = ".scarlet/images/rootfs-aarch64-full.ext2"

[[images.rootfs.layers]]
path = "../../bundles/full/bundle.toml"

[images.boot]
format = "limine-uefi"
output = ".scarlet/images/limine-aarch64-full.img"
cmdline = "console=ttyS0 root=/dev/vblk1"
deps = ["initramfs"]

[[images.boot.packages]]
source = ".scarlet/images/initramfs-aarch64-full.cpio"
to = "/boot/initramfs"

[runner]
command = "tools/run_aarch64.sh"

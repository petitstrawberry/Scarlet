schema_version = 2

[project]
name = "scarlet-aarch64-user-ios-desktop"

[bsp]
path = "../aarch64-user-ios-minimum/bsp"
package = "scarlet"

[bsp.kernel]
source = { path = "../../kernel" }
features = { hosted = true, network = true, user-fpu = true, user-vector = true, hypervisor = false, limine = false }

[userspace]
cargo-config = "userspace.toml"

[images.initramfs]
format = "newc"
output = ".scarlet/images/initramfs-aarch64-user-ios-desktop.cpio"

[[images.initramfs.layers]]
kind = "bundle"
path = "../../bundles/sgfx-native/bundle.toml"

[[images.initramfs.layers]]
kind = "copy"
source = "../aarch64-user-ios-minimum/initramfs"
to = "/"

[[images.initramfs.layers]]
kind = "bundle"
path = "../../bundles/base/bundle.toml"

[[images.initramfs.layers]]
kind = "bundle"
path = "../../bundles/cli-utils/bundle.toml"

[[images.initramfs.layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "init"
default-features = false
features = ["ios-init-pie"]
replace = true
to = "/init"

[[images.initramfs.layers]]
kind = "script"
source = "../aarch64-user-ios-minimum/tools/build_fixture.sh"
to = "/lib/libboot-check.so"

[[images.initramfs.layers]]
kind = "script"
source = "../aarch64-user-ios-minimum/tools/build_fixture.sh"
to = "/lib/libboot-check-alt.so"

[[images.initramfs.layers]]
kind = "script"
source = "../aarch64-user-ios-minimum/tools/build_fixture.sh"
to = "/bin/boot-check"

[images.rootfs]
console-root = true
format = "ext2"
output = ".scarlet/images/rootfs-aarch64-user-ios-desktop.ext2"

[[images.rootfs.layers]]
kind = "bundle"
path = "../../bundles/desktop/bundle.toml"

# Base also installs /init on the root image. Keep both copies catalog-compatible.
[[images.rootfs.layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "init"
default-features = false
features = ["ios-init-pie"]
replace = true
to = "/init"

[[images.rootfs.layers]]
kind = "script"
source = "../../tools/install-ca-certificates.sh"
to = "/etc/ssl/certs/ca-certificates.crt"

# Reuse the hosted guest driver and descriptor; the iOS BSP supplies the host GPU.
[[images.rootfs.layers]]
kind = "cargo"
source = "../aarch64-user-macos-full/bsp/sgfx-driver"
package = "sgfx-hosted"
lib = "sgfx_hosted"
to = "/lib/sgfx/libsgfx_hosted.so"

[[images.rootfs.layers]]
kind = "copy"
source = "../aarch64-user-macos-full/bsp/sgfx-driver/hosted-wgpu.sgfx-driver"
to = "/lib/sgfx/hosted-wgpu.sgfx-driver"

[hooks.post-image]
command = "tools/package_image.sh"

[runner]
command = "tools/run_ios.sh"

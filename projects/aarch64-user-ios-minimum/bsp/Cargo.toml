[package]
name = "scarlet-aarch64-user-ios-minimum-bsp"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "scarlet"
path = "src/main.rs"

[dependencies]
libc = "0.2"
vt100 = "0.16"
scarlet = { path = "../../../kernel", default-features = false, features = ["hosted", "network", "user-fpu", "user-vector"] }
scarlet-abi = { path = "../../../user/lib/scarlet-abi" }
scarlet-hosted-runtime = { path = "../../../kernel/hosted/runtime" }

# Native console boot without a service manager or desktop dependencies.
# Select the initial program with init.exec=/bin/login in the board runner.

[[layers]]
kind = "copy"
source = "../base/fs"
to = "/"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "init"
default-features = false
to = "/init"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "login"
default-features = false
to = "/bin/login"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "sh"
default-features = false
to = "/bin/sh"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "ps"
default-features = false
to = "/bin/ps"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "pty-smoke"
default-features = false
to = "/bin/pty-smoke"

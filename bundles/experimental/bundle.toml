# Scarlet Experimental Bundle
# Experimental features and applications for testing and development.

[[layers]]
kind = "copy"
source = "fs"
to = "/"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/moonlight-scarlet.git", rev = "acca3a593c16bc31eecbec74d782ff819b7295bf" }
package = "moonlight"
bin = "moonlight"
to = "/bin/moonlight"

[[layers]]
kind = "cargo"
source = "../../user/video_player"
package = "video_player"
bin = "video-player"
default-features = false
features = ["av1-stateful-hw", "h264-stateful-hw", "h264-stateless-hw", "mp4-aac"]
replace = true
to = "/bin/video-player"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/yt-for-scarlet", rev = "be6c04b5e6cc173748d3fdb9aac8d16add52164b" }
package = "yt"
bin = "yt"
to = "/bin/yt"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/yt-for-scarlet", rev = "be6c04b5e6cc173748d3fdb9aac8d16add52164b" }
package = "yt-gui"
bin = "yt-gui"
to = "/bin/yt-gui"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "axum-demo"
to = "/bin/axum-demo"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "reqwest-demo"
to = "/bin/reqwest-demo"

[[layers]]
kind = "cargo"
source = "../../user/tonic-demo"
package = "scarlet-tonic-demo"
bin = "tonic-server"
to = "/bin/tonic-server"

[[layers]]
kind = "cargo"
source = "../../user/tonic-demo"
package = "scarlet-tonic-demo"
bin = "tonic-client"
to = "/bin/tonic-client"

[[layers]]
kind = "cargo"
source = "../../user/websocket-demo"
package = "scarlet-websocket-demo"
bin = "ws-server"
to = "/bin/ws-server"

[[layers]]
kind = "cargo"
source = "../../user/websocket-demo"
package = "scarlet-websocket-demo"
bin = "ws-client"
to = "/bin/ws-client"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/blitz", rev = "c26e20dfff971941486ca9f50c8dcd332ec404da" }
subdir = "apps/scarlet-browser"
package = "blitz-scarlet-browser"
bin = "blitz"
to = "/bin/blitz"

[[layers]]
kind = "bundle"
source = { git = "https://github.com/petitstrawberry/resonara", rev = "088cc9d06cb7d4127727873eb4fb971a1c86b871" }
bundle = "platforms/scarlet/bundle.toml"

[[layers]]
kind = "bundle"
source = { git = "https://github.com/petitstrawberry/easyrpg-player-scarlet.git", rev = "b32ebc83655d680e339759b340a089f628968aa4" }

[[layers]]
kind = "bundle"
source = { git = "https://github.com/petitstrawberry/scarlet-bundle-linux-games.git", rev = "6f856392be9e42171339ae1633b2fd5e9fbe2e49" }
subdir = "bundles/openttd"

[[layers]]
kind = "archive"
url = "https://github.com/petitstrawberry/scarlet-bundle-lwjgl/releases/download/v0.2.6/lwjgl-3.4.3-aarch64-v0.2.6.tar.gz"
sha256 = "sha256:8f3b401aa61f878e27e3e1476d289188e1ee832dde87a26bfc63496f215160d3"
format = "tar-gz"
strip_components = 1
to = "/"

[[layers]]
kind = "archive"
url = "https://github.com/petitstrawberry/scarlet-bundle-openjdk/releases/download/v0.1.14/openjdk-25-aarch64-v0.1.14.tar.gz"
sha256 = "sha256:fb4cdc850baf25f48f9e03ba89a32ff568602d35daa2f9e6535225b4daf75c8e"
format = "tar-gz"
strip_components = 1
to = "/"

# Scarlet Experimental Bundle
# Experimental features and applications for testing and development.

[[layers]]
kind = "copy"
source = "fs/systems"
to = "/systems"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/moonlight-scarlet.git", rev = "0a0a263b8b1538d0f98d9ad7820a589230228c6b" }
package = "moonlight"
bin = "moonlight"
to = "/systems/scarlet/bin/moonlight"

[[layers]]
kind = "cargo"
source = "../../user/video_player"
package = "video_player"
bin = "video-player"
default-features = false
features = ["av1-stateful-hw", "h264-stateful-hw", "h264-stateless-hw", "mp4-aac"]
replace = true
to = "/systems/scarlet/bin/video-player"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/yt-for-scarlet" }
package = "yt"
bin = "yt"
to = "/systems/scarlet/bin/yt"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/yt-for-scarlet" }
package = "yt-gui"
bin = "yt-gui"
to = "/systems/scarlet/bin/yt-gui"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "axum-demo"
to = "/systems/scarlet/bin/axum-demo"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "reqwest-demo"
to = "/systems/scarlet/bin/reqwest-demo"

[[layers]]
kind = "cargo"
source = "../../user/tonic-demo"
package = "scarlet-tonic-demo"
bin = "tonic-server"
to = "/systems/scarlet/bin/tonic-server"

[[layers]]
kind = "cargo"
source = "../../user/tonic-demo"
package = "scarlet-tonic-demo"
bin = "tonic-client"
to = "/systems/scarlet/bin/tonic-client"

[[layers]]
kind = "cargo"
source = "../../user/websocket-demo"
package = "scarlet-websocket-demo"
bin = "ws-server"
to = "/systems/scarlet/bin/ws-server"

[[layers]]
kind = "cargo"
source = "../../user/websocket-demo"
package = "scarlet-websocket-demo"
bin = "ws-client"
to = "/systems/scarlet/bin/ws-client"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/blitz", rev = "c26e20dfff971941486ca9f50c8dcd332ec404da" }
subdir = "apps/scarlet-browser"
package = "blitz-scarlet-browser"
bin = "blitz"
to = "/systems/scarlet/bin/blitz"

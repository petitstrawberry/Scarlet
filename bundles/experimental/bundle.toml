# Scarlet Experimental Bundle
# Experimental features and applications for testing and development.

[[layers]]
kind = "copy"
source = "fs"
to = "/"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/moonlight-scarlet.git", rev = "a5e72b55e28ac7b618d42f1ad5201b856c2f7b9c" }
package = "moonlight"
bin = "moonlight"
to = "/bin/moonlight"

[[layers]]
kind = "cargo"
source = "../../user/video_player"
package = "video_player"
bin = "video-player"
default-features = false
features = ["av1-stateful-hw", "h264-stateful-hw", "h264-stateless-hw", "mp4-aac"]
replace = true
to = "/bin/video-player"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/yt-for-scarlet", rev = "3f008c3bfc86072341d818364bc661360c2a05b1" }
package = "yt"
bin = "yt"
to = "/bin/yt"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/yt-for-scarlet", rev = "3f008c3bfc86072341d818364bc661360c2a05b1" }
package = "yt-gui"
bin = "yt-gui"
to = "/bin/yt-gui"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "axum-demo"
to = "/bin/axum-demo"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "reqwest-demo"
to = "/bin/reqwest-demo"

[[layers]]
kind = "cargo"
source = "../../user/tonic-demo"
package = "scarlet-tonic-demo"
bin = "tonic-server"
to = "/bin/tonic-server"

[[layers]]
kind = "cargo"
source = "../../user/tonic-demo"
package = "scarlet-tonic-demo"
bin = "tonic-client"
to = "/bin/tonic-client"

[[layers]]
kind = "cargo"
source = "../../user/websocket-demo"
package = "scarlet-websocket-demo"
bin = "ws-server"
to = "/bin/ws-server"

[[layers]]
kind = "cargo"
source = "../../user/websocket-demo"
package = "scarlet-websocket-demo"
bin = "ws-client"
to = "/bin/ws-client"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/blitz", rev = "c26e20dfff971941486ca9f50c8dcd332ec404da" }
subdir = "apps/scarlet-browser"
package = "blitz-scarlet-browser"
bin = "blitz"
to = "/bin/blitz"

[[layers]]
kind = "bundle"
source = { git = "https://github.com/petitstrawberry/resonara", rev = "ae33ff44e3a246c49351bc719944ce9f7c44a087" }
bundle = "platforms/scarlet/bundle.toml"

[[layers]]
kind = "bundle"
source = { git = "https://github.com/petitstrawberry/easyrpg-player-scarlet.git", rev = "cd3b903f991c9c3d1094bf85b88b560d0ce3293f" }

[[layers]]
kind = "bundle"
source = { git = "https://github.com/petitstrawberry/scarlet-bundle-linux-games.git", rev = "6f856392be9e42171339ae1633b2fd5e9fbe2e49" }
subdir = "bundles/openttd"

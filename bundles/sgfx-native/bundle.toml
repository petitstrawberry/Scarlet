# Native graphics packages own their builds; the SDK owns retrieval and output.
# Keep the SGFX revision aligned with user/lib/scarlet-vulkan/bundle.toml:
# the SDK shares one source checkout per Git URL during image assembly.
[[layers]]
kind = "bundle"
source = { git = "https://github.com/petitstrawberry/sgfx", rev = "f25a6db371998cb5460db637415084558e3be4fa" }
subdir = "platforms/scarlet"

[[layers]]
kind = "bundle"
path = "../../user/lib/scarlet-vulkan/bundle.toml"

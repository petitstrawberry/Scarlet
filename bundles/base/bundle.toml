# Scarlet Base Bundle
# Essential system directories and binaries for boot and basic shell access.

[[layers]]
kind = "copy"
source = "fs"
to = "/"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "init"
to = "/system/scarlet/bin/init"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "sh"
to = "/system/scarlet/bin/sh"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "login"
to = "/system/scarlet/bin/login"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "stemd"
to = "/system/scarlet/bin/stemd"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "sbusd"
to = "/system/scarlet/bin/sbusd"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "hello"
to = "/system/scarlet/bin/hello"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "ps"
to = "/system/scarlet/bin/ps"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "shutdown"
to = "/system/scarlet/bin/shutdown"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "top"
to = "/system/scarlet/bin/top"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "kill"
to = "/system/scarlet/bin/kill"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "scpm"
to = "/system/scarlet/bin/scpm"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "netcfgd"
to = "/system/scarlet/bin/netcfgd"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "resolverd"
to = "/system/scarlet/bin/resolverd"

# AArch64 full image using the experimental Debian trixie glibc Linux view.
# Includes Box64 and Wine64 for initial 64-bit Windows console bring-up.
# This Debian profile has no Mozc or Chromium overlay.

[[layers]]
kind = "bundle"
path = "../desktop/bundle.toml"

[[layers]]
kind = "bundle"
source = { git = "https://github.com/petitstrawberry/scarlet-bundle-debian.git", rev = "0307627299daf05792fc7b16a1754ea34b665bda" }
subdir = "bundles/rootfs"

# Runtime compatibility updates over the pinned Debian archive.
[[layers]]
kind = "copy"
source = "fs"
to = "/"

[[layers]]
kind = "bundle"
path = "../experimental/bundle.toml"

[[layers]]
kind = "bundle"
path = "../rust-toolchain/bundle.toml"

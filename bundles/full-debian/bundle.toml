# AArch64 full image using the experimental Debian trixie glibc Linux view.
# Includes shared Linux graphics/game dependencies and preinstalled Mozc.
# Japanese conversion uses Scarlet's native Mozc launcher and SWS service.

[[layers]]
kind = "bundle"
path = "../desktop/bundle.toml"

[[layers]]
kind = "bundle"
source = { git = "https://github.com/petitstrawberry/scarlet-bundle-debian.git", rev = "19fd5b615596573e4193c364b1995a4c3550c759" }
subdir = "bundles/rootfs"

# Runtime compatibility updates over the pinned Debian archive.
[[layers]]
kind = "copy"
source = "fs"
to = "/"

[[layers]]
kind = "bundle"
path = "../experimental/bundle.toml"

[[layers]]
kind = "bundle"
path = "../rust-toolchain/bundle.toml"

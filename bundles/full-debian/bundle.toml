# AArch64 full image using the experimental Debian trixie glibc Linux view.
# The initial Debian release supplies a base rootfs without Mozc or Chromium.

[[layers]]
kind = "bundle"
path = "../desktop/bundle.toml"

[[layers]]
kind = "bundle"
source = { git = "https://github.com/petitstrawberry/scarlet-bundle-debian.git", rev = "772cc7f7da2e838e28e42990943612b8b89d06a8" }
subdir = "bundles/rootfs"

[[layers]]
kind = "bundle"
path = "../experimental/bundle.toml"

[[layers]]
kind = "bundle"
path = "../rust-toolchain/bundle.toml"

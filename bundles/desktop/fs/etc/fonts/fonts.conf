<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/share/fonts</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
  <alias><family>sans-serif</family><prefer><family>Noto Sans CJK JP</family><family>M PLUS 1</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Noto Serif CJK JP</family><family>M PLUS 1</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>JetBrainsMono Nerd Font Mono</family></prefer></alias>
  <alias><family>Times</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
  <alias><family>Times New Roman</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
  <alias><family>Georgia</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
  <alias><family>Courier</family><prefer><family>JetBrainsMono Nerd Font Mono</family></prefer></alias>
  <alias><family>Courier New</family><prefer><family>JetBrainsMono Nerd Font Mono</family></prefer></alias>
  <match target="pattern">
    <test name="family" compare="not_eq"><string>monospace</string></test>
    <edit name="family" mode="append"><string>Noto Sans CJK JP</string><string>M PLUS 1</string></edit>
  </match>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>
</fontconfig>

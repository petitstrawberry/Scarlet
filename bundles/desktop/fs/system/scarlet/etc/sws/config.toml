[output]
scale = 2.0

[input_method]
# Stable service name; SWS restores it when the IME registers.
active = "scarlet-mozc"

[keybindings]
# SWS-level shortcuts are matched before the focused client receives the key.
# Other useful values include "Ctrl+Space", "Zenkaku_Hankaku", "Henkan", and "Muhenkan".
ime_toggle = "Ctrl+Space"

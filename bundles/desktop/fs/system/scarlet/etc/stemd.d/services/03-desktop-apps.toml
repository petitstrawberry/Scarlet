# Desktop applications that provide a resident SBUS endpoint.
# They start after SWS, but keep their normal windows hidden until requested.

[service.desktop-files]
exec = "/bin/files --service"
order = 03
depends = ["sws"]
tty = "/dev/tty0"

[service.desktop-launcher]
exec = "/bin/launcher"
order = 03
depends = ["sws"]

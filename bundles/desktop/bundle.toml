# Scarlet Desktop Bundle
# GUI and desktop environment components.
# Composes base + cli-utils + desktop-specific packages.

[[layers]]
kind = "bundle"
path = "../base/bundle.toml"

[[layers]]
kind = "bundle"
path = "../cli-utils/bundle.toml"

[[layers]]
kind = "copy"
source = "fs"
to = "/"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "scarlet-desktop"
to = "/system/scarlet/bin/scarlet-desktop"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "desktop-background"
to = "/system/scarlet/bin/desktop-background"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "desktop-settings"
to = "/system/scarlet/bin/desktop-settings"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "files"
to = "/system/scarlet/bin/files"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "launcher"
to = "/system/scarlet/bin/launcher"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "notepad"
to = "/system/scarlet/bin/notepad"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "taskbar"
to = "/system/scarlet/bin/taskbar"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "terminal"
to = "/system/scarlet/bin/terminal"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "sws"
to = "/system/scarlet/bin/sws"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "sas"
to = "/system/scarlet/bin/sas"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "sasctl"
to = "/system/scarlet/bin/sasctl"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "mplayer"
to = "/system/scarlet/bin/mplayer"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "ui-demo"
to = "/system/scarlet/bin/ui-demo"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "ui-benchmark"
to = "/system/scarlet/bin/ui-benchmark"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/scarlet-ui" }
subdir = "examples/widget-factory"
package = "scarlet-ui-widget-factory"
bin = "scarlet-ui-widget-factory"
to = "/system/scarlet/bin/widget-factory"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "ui-sgfx-showcase"
to = "/system/scarlet/bin/ui-sgfx-showcase"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "settings"
to = "/system/scarlet/bin/settings"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "task-manager"
to = "/system/scarlet/bin/task-manager"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "scarlet-skk"
to = "/system/scarlet/bin/scarlet-skk"

[[layers]]
kind = "script"
source = "tools/fetch_skk_dictionary.sh"
output = ".scarlet/cache/skk/SKK-JISYO.L"
to = "/system/scarlet/share/skk/SKK-JISYO.L"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "wayland-bridge"
to = "/system/scarlet/bin/wayland-bridge"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "ansi-banner"
to = "/system/scarlet/bin/ansi-banner"

[[layers]]
kind = "cargo"
source = "../../user/video_player"
package = "video_player"
bin = "video-player"
default-features = false
features = ["av1-stateful-hw", "h264-stateful-hw", "mp4-aac"]
to = "/system/scarlet/bin/video-player"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "sgfx-probe"
to = "/system/scarlet/bin/sgfx-probe"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "sgfx-cube"
to = "/system/scarlet/bin/sgfx-cube"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "sgfx-texture"
to = "/system/scarlet/bin/sgfx-texture"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "sgfx-showcase"
to = "/system/scarlet/bin/sgfx-showcase"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "httpd"
to = "/system/scarlet/bin/httpd"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "ushv"
to = "/system/scarlet/bin/ushv"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "lsm-list"
to = "/system/scarlet/bin/lsm-list"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "clock"
to = "/system/scarlet/bin/clock"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "lsm-load"
to = "/system/scarlet/bin/lsm-load"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "lsm-unload"
to = "/system/scarlet/bin/lsm-unload"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "input-dump"
to = "/system/scarlet/bin/input-dump"

[[layers]]
kind = "cargo"
source = "../../user/bin"
bin = "mozc-server"
to = "/system/scarlet/bin/mozc-server"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "scarlet-mozc"
to = "/system/scarlet/bin/scarlet-mozc"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "dcp-flip-test"
to = "/system/scarlet/bin/dcp-flip-test"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/carmine" }
package = "carmine"
bin = "carmine"
to = "/system/scarlet/bin/carmine"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/vellum", rev = "c2755acf5f6aa301700449c30c2f4f7b02c5dbd5" }
package = "vellum"
bin = "vellum"
to = "/system/scarlet/bin/vellum"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/boxcraft" }
package = "boxcraft"
bin = "boxcraft"
to = "/system/scarlet/bin/boxcraft"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "remote-desktop"
to = "/system/scarlet/bin/remote-desktop"

# Scarlet Desktop Bundle
# GUI and desktop environment components.
# Composes base + cli-utils + desktop-specific packages.

[[layers]]
kind = "bundle"
path = "../base/bundle.toml"

[[layers]]
kind = "bundle"
path = "../cli-utils/bundle.toml"

[[layers]]
kind = "copy"
source = "fs"
to = "/"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "scarlet_desktop"
to = "/system/scarlet/bin/scarlet_desktop"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "scarlet_desktop_background"
to = "/system/scarlet/bin/scarlet_desktop_background"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "scarlet_desktop_taskbar"
to = "/system/scarlet/bin/scarlet_desktop_taskbar"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "terminal"
to = "/system/scarlet/bin/terminal"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "sws"
to = "/system/scarlet/bin/sws"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "sas"
to = "/system/scarlet/bin/sas"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "ui-demo"
to = "/system/scarlet/bin/ui-demo"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "pdfview"
to = "/system/scarlet/bin/pdfview"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "settings"
to = "/system/scarlet/bin/settings"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "scarlet_skk"
to = "/system/scarlet/bin/scarlet_skk"

[[layers]]
kind = "script"
source = "tools/fetch_skk_dictionary.sh"
output = ".scarlet/cache/skk/SKK-JISYO.L"
to = "/system/scarlet/share/skk/SKK-JISYO.L"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "wayland_bridge"
to = "/system/scarlet/bin/wayland_bridge"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "ansi_banner"
to = "/system/scarlet/bin/ansi_banner"

[[layers]]
kind = "cargo"
source = "../../user/bin"
bin = "video_player"
to = "/system/scarlet/bin/video_player"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "gpu_probe"
to = "/system/scarlet/bin/gpu_probe"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "httpd"
to = "/system/scarlet/bin/httpd"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "ushv"
to = "/system/scarlet/bin/ushv"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "lsm_list"
to = "/system/scarlet/bin/lsm_list"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "lsm_load"
to = "/system/scarlet/bin/lsm_load"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "lsm_unload"
to = "/system/scarlet/bin/lsm_unload"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "input_dump"
to = "/system/scarlet/bin/input_dump"
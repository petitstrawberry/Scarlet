# Scarlet Desktop Bundle
# GUI and desktop environment components.
# Composes sgfx-native + base + cli-utils + desktop-specific packages.

# Prepare SGFX sources, userspace Cargo configuration, and native drivers
# before any userspace packages from this bundle are built.
[[layers]]
kind = "bundle"
path = "../sgfx-native/bundle.toml"

[[layers]]
kind = "bundle"
path = "../wireless/bundle.toml"

[[layers]]
kind = "bundle"
path = "../bluetooth/bundle.toml"

[[layers]]
kind = "bundle"
path = "../base/bundle.toml"

[[layers]]
kind = "bundle"
path = "../cli-utils/bundle.toml"

[[layers]]
kind = "copy"
source = "fs"
to = "/"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "scarlet-session"
to = "/bin/scarlet-session"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "scarlet-desktop"
to = "/bin/scarlet-desktop"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "desktop-settings"
to = "/bin/desktop-settings"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "files"
to = "/bin/files"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "notepad"
to = "/bin/notepad"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "scarlet-shell"
to = "/bin/scarlet-shell"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "scarlet-seat"
to = "/bin/scarlet-seat"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "scarlet-shell-greeter"
to = "/bin/scarlet-shell-greeter"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "terminal"
to = "/bin/terminal"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "sws"
to = "/bin/sws"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "sas"
to = "/bin/sas"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "sasctl"
to = "/bin/sasctl"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "mplayer"
to = "/bin/mplayer"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "ui-demo"
to = "/bin/ui-demo"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "ui-benchmark"
to = "/bin/ui-benchmark"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "1a442db8b2786f9031689b7d7fb78fd49d407ca5" }
subdir = "examples/widget-factory"
package = "scarlet-ui-widget-factory"
bin = "scarlet-ui-widget-factory"
to = "/bin/widget-factory"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "ui-sgfx-showcase"
to = "/bin/ui-sgfx-showcase"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "settings"
to = "/bin/settings"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "task-manager"
to = "/bin/task-manager"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "scarlet-skk"
to = "/bin/scarlet-skk"

[[layers]]
kind = "script"
source = "tools/fetch_skk_dictionary.sh"
output = ".scarlet/cache/skk/SKK-JISYO.L"
to = "/share/skk/SKK-JISYO.L"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "wayland-bridge"
to = "/bin/wayland-bridge"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "ansi-banner"
to = "/bin/ansi-banner"

[[layers]]
kind = "cargo"
source = "../../user/video_player"
package = "video_player"
bin = "video-player"
default-features = false
features = ["av1-stateful-hw", "h264-stateful-hw", "mp4-aac"]
to = "/bin/video-player"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "sgfx-probe"
to = "/bin/sgfx-probe"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "sgfx-cube"
to = "/bin/sgfx-cube"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "sgfx-texture"
to = "/bin/sgfx-texture"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "sgfx-showcase"
to = "/bin/sgfx-showcase"

[[layers]]
kind = "cargo"
source = "../../user/vulkan-canvas-demo"
package = "vulkan-canvas-demo"
bin = "vulkan-canvas-demo"
to = "/bin/vulkan-canvas-demo"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "httpd"
to = "/bin/httpd"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "ushv"
to = "/bin/ushv"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "lsm-list"
to = "/bin/lsm-list"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "clock"
to = "/bin/clock"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "lsm-load"
to = "/bin/lsm-load"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "lsm-unload"
to = "/bin/lsm-unload"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "input-dump"
to = "/bin/input-dump"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "displayctl"
to = "/bin/displayctl"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "sensor-dump"
to = "/bin/sensor-dump"

[[layers]]
kind = "cargo"
source = "../../user/bin"
bin = "mozc-server"
to = "/bin/mozc-server"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "scarlet-mozc"
to = "/bin/scarlet-mozc"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "dcp-flip-test"
to = "/bin/dcp-flip-test"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/carmine", rev = "f8e58a22e9ba14f43f443b7372199241adf50d97" }
package = "carmine"
bin = "carmine"
to = "/bin/carmine"

[[layers]]
kind = "bundle"
path = "../myrica/{arch}.toml"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/vellum", rev = "8f3ff9609dcc96f4a4de725996842f9d1b8b0478" }
package = "vellum"
bin = "vellum"
to = "/bin/vellum"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/boxcraft", rev = "4beb1cd1c667c3b2aabd22062d36b6717f12d1df" }
package = "boxcraft"
bin = "boxcraft"
to = "/bin/boxcraft"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "remote-desktop"
to = "/bin/remote-desktop"

# Cadence owns its app recipe and preserves the PIC build and final ELF audit.
[[layers]]
kind = "bundle"
source = { git = "https://github.com/petitstrawberry/cadence", rev = "17ae3962f7d33cc324fed0365d1b63ea6ac01330" }
subdir = "platforms/scarlet"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "soft-keyboard"
to = "/bin/soft-keyboard"

# Native app-format demo; source, metadata and resources live in user/app-demo.
[[layers]]
kind = "app"
source = "../../user/app-demo/app.toml"
to = "/applications/app-demo.app"
architectures = ["aarch64", "riscv64"]

# Everyday desktop utilities.
[[layers]]
kind = "app"
source = "../../user/std-bin/src/storage/app.toml"
to = "/applications/storage.app"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "calculator"
to = "/bin/calculator"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "calendar"
to = "/bin/calendar"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "characters"
to = "/bin/characters"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "screenshot"
to = "/bin/screenshot"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "log-viewer"
to = "/bin/log-viewer"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "applications"
to = "/bin/applications"

# Kureha Code distributes prebuilt app archives with a checksum-pinned bundle.
[[layers]]
kind = "archive"
url = "https://github.com/petitstrawberry/kureha-code/releases/download/v0.1.0-51.1/kureha-code-scarlet-{arch}-v0.1.0-51.1.tar.gz"
sha256 = { aarch64 = "sha256:37b2b1734f2d84b39a95e8e0290b166387d1896669af81b72629828d6be487c5", riscv64 = "sha256:b14be23ac4f49d4d7e54a45e0c9feab6df29e87f805c950186c8c903ae4bc334" }
format = "tar-gz"
to = "/"

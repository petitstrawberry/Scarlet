# Scarlet Desktop Bundle
# GUI and desktop environment components.
# Composes base + cli-utils + desktop-specific packages.

[[layers]]
kind = "bundle"
path = "../base/bundle.toml"

[[layers]]
kind = "bundle"
path = "../cli-utils/bundle.toml"

[[layers]]
kind = "copy"
source = "fs"
to = "/"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "scarlet_desktop"
to = "/system/scarlet/bin/scarlet_desktop"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "desktop-background"
to = "/system/scarlet/bin/desktop-background"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "desktop-settings"
to = "/system/scarlet/bin/desktop-settings"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "files"
to = "/system/scarlet/bin/files"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "launcher"
to = "/system/scarlet/bin/launcher"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "notepad"
to = "/system/scarlet/bin/notepad"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "taskbar"
to = "/system/scarlet/bin/taskbar"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "terminal"
to = "/system/scarlet/bin/terminal"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "sws"
to = "/system/scarlet/bin/sws"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "sas"
to = "/system/scarlet/bin/sas"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "sasctl"
to = "/system/scarlet/bin/sasctl"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "mplayer"
to = "/system/scarlet/bin/mplayer"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "ui-demo"
to = "/system/scarlet/bin/ui-demo"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "ui-benchmark"
to = "/system/scarlet/bin/ui-benchmark"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/scarlet-ui" }
subdir = "examples/widget-factory"
package = "scarlet-ui-widget-factory"
bin = "scarlet-ui-widget-factory"
to = "/system/scarlet/bin/widget_factory"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "ui-sgfx-showcase"
to = "/system/scarlet/bin/ui-sgfx-showcase"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "pdfview"
to = "/system/scarlet/bin/pdfview"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "settings"
to = "/system/scarlet/bin/settings"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "task_manager"
to = "/system/scarlet/bin/task_manager"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "scarlet_skk"
to = "/system/scarlet/bin/scarlet_skk"

[[layers]]
kind = "script"
source = "tools/fetch_skk_dictionary.sh"
output = ".scarlet/cache/skk/SKK-JISYO.L"
to = "/system/scarlet/share/skk/SKK-JISYO.L"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "wayland_bridge"
to = "/system/scarlet/bin/wayland_bridge"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "ansi_banner"
to = "/system/scarlet/bin/ansi_banner"

[[layers]]
kind = "cargo"
source = "../../user/video_player"
package = "video_player"
bin = "video_player"
default-features = false
features = ["av1-stateful-hw", "h264-stateful-hw", "mp4-aac"]
to = "/system/scarlet/bin/video_player"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "sgfx_probe"
to = "/system/scarlet/bin/sgfx_probe"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "sgfx_cube"
to = "/system/scarlet/bin/sgfx_cube"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "sgfx_texture"
to = "/system/scarlet/bin/sgfx_texture"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "sgfx_showcase"
to = "/system/scarlet/bin/sgfx_showcase"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "httpd"
to = "/system/scarlet/bin/httpd"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "ushv"
to = "/system/scarlet/bin/ushv"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "lsm_list"
to = "/system/scarlet/bin/lsm_list"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "clock"
to = "/system/scarlet/bin/clock"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "lsm_load"
to = "/system/scarlet/bin/lsm_load"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "lsm_unload"
to = "/system/scarlet/bin/lsm_unload"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "input_dump"
to = "/system/scarlet/bin/input_dump"

[[layers]]
kind = "cargo"
source = "../../user/bin"
bin = "mozc_server"
to = "/system/scarlet/bin/mozc_server"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "scarlet_mozc"
to = "/system/scarlet/bin/scarlet_mozc"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "dcp_flip_test"
to = "/system/scarlet/bin/dcp_flip_test"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/carmine" }
package = "carmine"
bin = "carmine"
to = "/system/scarlet/bin/carmine"

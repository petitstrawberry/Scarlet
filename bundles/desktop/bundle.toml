# Scarlet Desktop Bundle
# GUI and desktop environment components.
# Composes sgfx-native + base + cli-utils + desktop-specific packages.

# Prepare SGFX sources, userspace Cargo configuration, and native drivers
# before any userspace packages from this bundle are built.
[[layers]]
kind = "bundle"
path = "../sgfx-native/bundle.toml"

[[layers]]
kind = "bundle"
path = "../base/bundle.toml"

[[layers]]
kind = "bundle"
path = "../cli-utils/bundle.toml"

[[layers]]
kind = "copy"
source = "fs"
to = "/"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "scarlet-desktop"
to = "/bin/scarlet-desktop"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "desktop-settings"
to = "/bin/desktop-settings"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "files"
to = "/bin/files"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "notepad"
to = "/bin/notepad"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "scarlet-shell"
to = "/bin/scarlet-shell"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "terminal"
to = "/bin/terminal"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "sws"
to = "/bin/sws"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "sas"
to = "/bin/sas"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "sasctl"
to = "/bin/sasctl"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "mplayer"
to = "/bin/mplayer"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "ui-demo"
to = "/bin/ui-demo"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "ui-benchmark"
to = "/bin/ui-benchmark"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "eede18df956fa4599027f783266c5879d1afe564" }
subdir = "examples/widget-factory"
package = "scarlet-ui-widget-factory"
bin = "scarlet-ui-widget-factory"
to = "/bin/widget-factory"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "ui-sgfx-showcase"
to = "/bin/ui-sgfx-showcase"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "settings"
to = "/bin/settings"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "task-manager"
to = "/bin/task-manager"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "scarlet-skk"
to = "/bin/scarlet-skk"

[[layers]]
kind = "script"
source = "tools/fetch_skk_dictionary.sh"
output = ".scarlet/cache/skk/SKK-JISYO.L"
to = "/share/skk/SKK-JISYO.L"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "wayland-bridge"
to = "/bin/wayland-bridge"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "ansi-banner"
to = "/bin/ansi-banner"

[[layers]]
kind = "cargo"
source = "../../user/video_player"
package = "video_player"
bin = "video-player"
default-features = false
features = ["av1-stateful-hw", "h264-stateful-hw", "mp4-aac"]
to = "/bin/video-player"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "sgfx-probe"
to = "/bin/sgfx-probe"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "sgfx-cube"
to = "/bin/sgfx-cube"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "sgfx-texture"
to = "/bin/sgfx-texture"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "sgfx-showcase"
to = "/bin/sgfx-showcase"

[[layers]]
kind = "cargo"
source = "../../user/vulkan-canvas-demo"
package = "vulkan-canvas-demo"
bin = "vulkan-canvas-demo"
to = "/bin/vulkan-canvas-demo"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "httpd"
to = "/bin/httpd"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "ushv"
to = "/bin/ushv"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "lsm-list"
to = "/bin/lsm-list"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "clock"
to = "/bin/clock"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "lsm-load"
to = "/bin/lsm-load"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "lsm-unload"
to = "/bin/lsm-unload"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "input-dump"
to = "/bin/input-dump"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "displayctl"
to = "/bin/displayctl"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "sensor-dump"
to = "/bin/sensor-dump"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "tabletctl"
to = "/bin/tabletctl"

[[layers]]
kind = "cargo"
source = "../../user/bin"
bin = "mozc-server"
to = "/bin/mozc-server"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "scarlet-mozc"
to = "/bin/scarlet-mozc"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "dcp-flip-test"
to = "/bin/dcp-flip-test"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/carmine", rev = "d101a7f2581bb19f8d83012bac228eb87a92b20b" }
package = "carmine"
bin = "carmine"
to = "/bin/carmine"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/myrica", rev = "770262b09b5374686839cbcf500269d04670c295" }
package = "myrica"
bin = "myrica"
architectures = ["riscv32", "riscv64"]
to = "/bin/myrica"

# Myrica owns the WebKit browser and its Linux-view Widevine host recipe.
[[layers]]
kind = "bundle"
source = { git = "https://github.com/petitstrawberry/myrica", rev = "770262b09b5374686839cbcf500269d04670c295" }
subdir = "platforms/scarlet"
architectures = ["aarch64"]

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/vellum", rev = "783efe9f28a9d575aed927ae1e5dc132394bab27" }
package = "vellum"
bin = "vellum"
to = "/bin/vellum"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/boxcraft", rev = "029402c302f39a43d028a67667056ab5d54cec22" }
package = "boxcraft"
bin = "boxcraft"
to = "/bin/boxcraft"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "remote-desktop"
to = "/bin/remote-desktop"

# Cadence owns its app recipe and preserves the PIC build and final ELF audit.
[[layers]]
kind = "bundle"
source = { git = "https://github.com/petitstrawberry/cadence", rev = "1b5d0782a68bf2bd2fbc40502d3d576f57445d0e" }
subdir = "platforms/scarlet"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "soft-keyboard"
to = "/bin/soft-keyboard"

# Native app-format demo; source, metadata and resources live in user/app-demo.
[[layers]]
kind = "app"
source = "../../user/app-demo/app.toml"
to = "/applications/app-demo.app"
architectures = ["aarch64", "riscv64"]

# Everyday desktop utilities.
[[layers]]
kind = "app"
source = "../../user/std-bin/src/storage/app.toml"
to = "/applications/storage.app"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "calculator"
to = "/bin/calculator"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "calendar"
to = "/bin/calendar"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "characters"
to = "/bin/characters"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "screenshot"
to = "/bin/screenshot"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "log-viewer"
to = "/bin/log-viewer"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "applications"
to = "/bin/applications"

# Kureha Code owns its native app recipe and resources.
[[layers]]
kind = "bundle"
source = { git = "https://github.com/petitstrawberry/kureha-code.git", rev = "558d6fdfc7cefa8af8f643af397855d58f82cd4d" }
bundle = "platforms/scarlet/bundle.toml"

# Scarlet Desktop Bundle
# GUI and desktop environment components.
# Composes base + cli-utils + desktop-specific packages.

[[layers]]
kind = "bundle"
path = "../base/bundle.toml"

[[layers]]
kind = "bundle"
path = "../cli-utils/bundle.toml"

[[layers]]
kind = "copy"
source = "fs"
to = "/"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "scarlet-desktop"
to = "/bin/scarlet-desktop"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "desktop-settings"
to = "/bin/desktop-settings"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "files"
to = "/bin/files"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "notepad"
to = "/bin/notepad"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "scarlet-shell"
to = "/bin/scarlet-shell"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "terminal"
to = "/bin/terminal"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "sws"
to = "/bin/sws"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "sas"
to = "/bin/sas"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "sasctl"
to = "/bin/sasctl"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "mplayer"
to = "/bin/mplayer"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "ui-demo"
to = "/bin/ui-demo"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "ui-benchmark"
to = "/bin/ui-benchmark"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "1b0f08aeb0a7057c9a6d0d7312554372411afff8" }
subdir = "examples/widget-factory"
package = "scarlet-ui-widget-factory"
bin = "scarlet-ui-widget-factory"
to = "/bin/widget-factory"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "ui-sgfx-showcase"
to = "/bin/ui-sgfx-showcase"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "settings"
to = "/bin/settings"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "task-manager"
to = "/bin/task-manager"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "scarlet-skk"
to = "/bin/scarlet-skk"

[[layers]]
kind = "script"
source = "tools/fetch_skk_dictionary.sh"
output = ".scarlet/cache/skk/SKK-JISYO.L"
to = "/share/skk/SKK-JISYO.L"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "wayland-bridge"
to = "/bin/wayland-bridge"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "ansi-banner"
to = "/bin/ansi-banner"

[[layers]]
kind = "cargo"
source = "../../user/video_player"
package = "video_player"
bin = "video-player"
default-features = false
features = ["av1-stateful-hw", "h264-stateful-hw", "mp4-aac"]
to = "/bin/video-player"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "sgfx-probe"
to = "/bin/sgfx-probe"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "sgfx-cube"
to = "/bin/sgfx-cube"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "sgfx-texture"
to = "/bin/sgfx-texture"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "sgfx-showcase"
to = "/bin/sgfx-showcase"

[[layers]]
kind = "cargo"
source = "../../user/vulkan-canvas-demo"
package = "vulkan-canvas-demo"
bin = "vulkan-canvas-demo"
to = "/bin/vulkan-canvas-demo"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "httpd"
to = "/bin/httpd"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "ushv"
to = "/bin/ushv"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "lsm-list"
to = "/bin/lsm-list"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "clock"
to = "/bin/clock"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "lsm-load"
to = "/bin/lsm-load"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "lsm-unload"
to = "/bin/lsm-unload"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "input-dump"
to = "/bin/input-dump"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "displayctl"
to = "/bin/displayctl"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "sensor-dump"
to = "/bin/sensor-dump"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "tabletctl"
to = "/bin/tabletctl"

[[layers]]
kind = "cargo"
source = "../../user/bin"
bin = "mozc-server"
to = "/bin/mozc-server"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "scarlet-mozc"
to = "/bin/scarlet-mozc"

[[layers]]
kind = "cargo"
source = "../../user/bin"
package = "userprogram"
bin = "dcp-flip-test"
to = "/bin/dcp-flip-test"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/carmine", rev = "106809d9a6d5d0ec1a31a1b7b83e41e68878ee89" }
package = "carmine"
bin = "carmine"
to = "/bin/carmine"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/myrica", rev = "60b52e4c2eff17ea629c4df17ddc02fa00bacaa9" }
package = "myrica"
bin = "myrica"
to = "/bin/myrica"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/vellum", rev = "87a0f17173a7be09ead750f913b64b1fc5e0c785" }
package = "vellum"
bin = "vellum"
to = "/bin/vellum"

[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/boxcraft", rev = "a341f37b323572815871df1a95c8be812b9cdf86" }
package = "boxcraft"
bin = "boxcraft"
to = "/bin/boxcraft"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
bin = "remote-desktop"
to = "/bin/remote-desktop"

# Cadence owns its app recipe and preserves the PIC build and final ELF audit.
[[layers]]
kind = "bundle"
source = { git = "https://github.com/petitstrawberry/cadence", rev = "318353de2e97733979001b4ad70879a7a6825d61" }
subdir = "platforms/scarlet"

[[layers]]
kind = "cargo"
source = "../../user/std-bin"
package = "scarlet-std-bin"
bin = "soft-keyboard"
to = "/bin/soft-keyboard"

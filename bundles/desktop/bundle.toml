# Scarlet Desktop Bundle
# GUI and desktop environment components.
# Layer on top of scarlet-base for a graphical desktop experience.

[[files]]
source = "fs"
to = "/"

[[files]]
source = "templates/.shrc.tmpl"
to = "/system/scarlet/root/.shrc"
template = true

[[packages]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "scarlet_desktop"
to = "/system/scarlet/bin/scarlet_desktop"

[[packages]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "scarlet_desktop_background"
to = "/system/scarlet/bin/scarlet_desktop_background"

[[packages]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "scarlet_desktop_taskbar"
to = "/system/scarlet/bin/scarlet_desktop_taskbar"

[[packages]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "terminal"
to = "/system/scarlet/bin/terminal"

[[packages]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "sws"
to = "/system/scarlet/bin/sws"

[[packages]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "sas"
to = "/system/scarlet/bin/sas"

[[packages]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "ui-demo"
to = "/system/scarlet/bin/ui-demo"

[[packages]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "pdfview"
to = "/system/scarlet/bin/pdfview"

[[packages]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "settings"
to = "/system/scarlet/bin/settings"

[[packages]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "scarlet_skk"
to = "/system/scarlet/bin/scarlet_skk"

[[packages]]
kind = "script"
source = "tools/fetch_skk_dictionary.sh"
to = "/system/scarlet/share/skk/SKK-JISYO.L"

[[packages]]
kind = "cargo"
source = "../../user/bin"
package = "user-bin"
bin = "wayland_bridge"
to = "/system/scarlet/bin/wayland_bridge"

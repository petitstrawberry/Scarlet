# Scarlet Linux ABI Bundle
#
# The released Linux userspace is produced in scarlet-bundle-linux. Keep the
# producer repository out of the Scarlet checkout and consume its pinned
# runtime manifest instead.

[[layers]]
kind = "bundle"
source = { git = "https://github.com/petitstrawberry/scarlet-bundle-linux", rev = "8316aebb2ddcf7032120090fbac6a98d22b437f9" }
subdir = "bundles/rootfs"

[[layers]]
kind = "bundle"
source = { git = "https://github.com/petitstrawberry/scarlet-bundle-linux", rev = "8316aebb2ddcf7032120090fbac6a98d22b437f9" }
subdir = "bundles/mozc"

[[layers]]
kind = "copy"
source = "rootfs/data/config/linux-{arch}"
to = "/data/config/linux-{arch}"
template = true

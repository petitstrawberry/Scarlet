config_version = 1

[project]
name = "scarlet-riscv64-limine"

[board]
name = "riscv64-limine"
target = "riscv64gc-unknown-none-elf"
target_json = "../../kernel/targets/riscv64gc-unknown-none-elf.json"

[kernel]
package = "scarlet"
source = { path = "../../kernel" }

[kernel.features]
network = true
user-fpu = true
user-vector = true
hypervisor = true
limine = true
profiler = false

[modules]
"scarlet-module-prototype" = { path = "../../modules/scarlet-module-prototype", enabled = true }

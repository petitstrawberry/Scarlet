# Scarlet target needs a custom getrandom 0.4 backend backed by the
# native GetRandom syscall. The cfg is namespaced and only checked
# by the getrandom crate itself.
[target.'cfg(target_os = "scarlet")']
rustflags = ["--cfg", "getrandom_backend=\"custom\""]

# The desktop bundle enables Myrica's native WebKit backend. Other packages
# ignore this input; an explicit environment value can select another install.
[env]
MYRICA_WEBKIT_LINK_MANIFEST = { value = "../myrica/target/native-webkit/share/scarlet/ScarletWebView.link", relative = true }

name: CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

permissions:
  contents: write

jobs:
  temporary-format-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: fix/aarch64-lock-stall-watchdog

    - name: Format sync watchdog diagnostics
      run: rustfmt --edition 2024 kernel/src/sync/preempt.rs

    - name: Commit formatting repair
      run: |
        test -n "$(git status --porcelain -- kernel/src/sync/preempt.rs)"
        git config user.name github-actions[bot]
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com
        git add kernel/src/sync/preempt.rs
        git commit -m "Format sync watchdog diagnostics"
        git push origin HEAD:fix/aarch64-lock-stall-watchdog

  nix-cache:
    runs-on: ubuntu-latest
    env:
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        extra_nix_config: |
          accept-flake-config = true
          extra-substituters = https://scarlet-rust-toolchain.cachix.org
          extra-trusted-public-keys = scarlet-rust-toolchain.cachix.org-1:p+coBExi0nNTIvWF/oM9H9/1/GhwFtqGZ2Vs+4pYl6o=

    - uses: cachix/cachix-action@v17
      if: env.CACHIX_CACHE_NAME != ''
      with:
        name: ${{ env.CACHIX_CACHE_NAME }}
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

    - name: Build Linux devShell closure
      run: nix build --no-link .#devShells.x86_64-linux.default

  fmt:
    needs: nix-cache
    runs-on: ubuntu-latest
    env:
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
    steps:
    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        extra_nix_config: |
          accept-flake-config = true
          extra-substituters = https://scarlet-rust-toolchain.cachix.org
          extra-trusted-public-keys = scarlet-rust-toolchain.cachix.org-1:p+coBExi0nNTIvWF/oM9H9/1/GhwFtqGZ2Vs+4pYl6o=

    - uses: cachix/cachix-action@v17
      if: env.CACHIX_CACHE_NAME != ''
      with:
        name: ${{ env.CACHIX_CACHE_NAME }}

    - name: Run formatting check
      run: nix develop .#default --command cargo make fmt-check

  docker-image:
    needs: nix-cache
    runs-on: ubuntu-latest
    env:
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        extra_nix_config: |
          accept-flake-config = true
          extra-substituters = https://scarlet-rust-toolchain.cachix.org
          extra-trusted-public-keys = scarlet-rust-toolchain.cachix.org-1:p+coBExi0nNTIvWF/oM9H9/1/GhwFtqGZ2Vs+4pYl6o=

    - uses: cachix/cachix-action@v17
      if: env.CACHIX_CACHE_NAME != ''
      with:
        name: ${{ env.CACHIX_CACHE_NAME }}

    - name: Build Docker image with Nix
      run: nix build .#scarlet-dev-image

    - name: Smoke test Docker image
      run: |
        docker load < result
        docker run --rm scarlet-dev:latest rustc -vV

  test-riscv64:
    needs: nix-cache
    runs-on: ubuntu-latest
    env:
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        extra_nix_config: |
          accept-flake-config = true
          extra-substituters = https://scarlet-rust-toolchain.cachix.org
          extra-trusted-public-keys = scarlet-rust-toolchain.cachix.org-1:p+coBExi0nNTIvWF/oM9H9/1/GhwFtqGZ2Vs+4pYl6o=

    - uses: cachix/cachix-action@v17
      if: env.CACHIX_CACHE_NAME != ''
      with:
        name: ${{ env.CACHIX_CACHE_NAME }}

    - name: Build scarlet kernel (riscv64)
      run: nix develop .#default --command cargo make build-riscv64

    - name: Test scarlet kernel (riscv64)
      run: nix develop .#default --command cargo make test-riscv64
      timeout-minutes: 10

  test-aarch64:
    needs: nix-cache
    runs-on: ubuntu-latest
    env:
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        extra_nix_config: |
          accept-flake-config = true
          extra-substituters = https://scarlet-rust-toolchain.cachix.org
          extra-trusted-public-keys = scarlet-rust-toolchain.cachix.org-1:p+coBExi0nNTIvWF/oM9H9/1/GhwFtqGZ2Vs+4pYl6o=

    - uses: cachix/cachix-action@v17
      if: env.CACHIX_CACHE_NAME != ''
      with:
        name: ${{ env.CACHIX_CACHE_NAME }}

    - name: Build scarlet kernel (aarch64)
      run: nix develop .#default --command cargo make build-aarch64

    - name: Test scarlet kernel (aarch64)
      run: nix develop .#default --command cargo make test-aarch64
      timeout-minutes: 10

name: CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

permissions:
  contents: write

jobs:
  nix-cache:
    runs-on: ubuntu-latest
    env:
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        extra_nix_config: |
          accept-flake-config = true
          extra-substituters = https://scarlet-rust-toolchain.cachix.org
          extra-trusted-public-keys = scarlet-rust-toolchain.cachix.org-1:p+coBExi0nNTIvWF/oM9H9/1/GhwFtqGZ2Vs+4pYl6o=

    - uses: cachix/cachix-action@v17
      if: env.CACHIX_CACHE_NAME != ''
      with:
        name: ${{ env.CACHIX_CACHE_NAME }}
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

    - name: Build Linux devShell closure
      run: nix build --no-link .#devShells.x86_64-linux.default

  fmt:
    needs: nix-cache
    runs-on: ubuntu-latest
    env:
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
    steps:
    - uses: actions/checkout@v4
      with:
        # Packet allocation regressions compare against a pinned ancestor.
        fetch-depth: 0

    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        extra_nix_config: |
          accept-flake-config = true
          extra-substituters = https://scarlet-rust-toolchain.cachix.org
          extra-trusted-public-keys = scarlet-rust-toolchain.cachix.org-1:p+coBExi0nNTIvWF/oM9H9/1/GhwFtqGZ2Vs+4pYl6o=

    - uses: cachix/cachix-action@v17
      if: env.CACHIX_CACHE_NAME != ''
      with:
        name: ${{ env.CACHIX_CACHE_NAME }}

    - name: Run formatting check
      run: nix develop .#default --command cargo make fmt-check

    - name: Test QMP control helper
      run: nix develop .#default --command cargo make test-qmp

    - name: Test native ABI and SWS wire contracts
      run: nix develop .#default --command cargo make test-release-contracts

    - name: Test Native Wi-Fi and PCI host contracts
      run: |
        nix develop .#default --command bash -euc '
          python3 tools/test-pci-config-host.py
          python3 tools/test-pci-probe-host.py
          python3 tools/test-wpa-supplicant-host.py
          python3 tools/test-network-regression.py --suite packet --suite backpressure --suite drain --suite arp
          wireless_host=$(rustc -vV | sed -n "s/^host: //p")
          cargo test --locked --manifest-path tools/wireless-management/host/Cargo.toml --target "$wireless_host"
          cargo fmt --manifest-path user/lib/scarlet-wpa/Cargo.toml -- --check
          cargo fmt --manifest-path user/wpa-supplicant/Cargo.toml -- --check
        '

    - name: Test native libc
      run: nix build .#checks.x86_64-linux.scarlet-libc --no-link

    - name: Check ABI foundation against RV32 and ARMv5TE constraints
      run: nix develop .#default --command cargo make test-abi-foundation

  docker-image:
    needs: nix-cache
    runs-on: ubuntu-latest
    env:
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        extra_nix_config: |
          accept-flake-config = true
          extra-substituters = https://scarlet-rust-toolchain.cachix.org
          extra-trusted-public-keys = scarlet-rust-toolchain.cachix.org-1:p+coBExi0nNTIvWF/oM9H9/1/GhwFtqGZ2Vs+4pYl6o=

    - uses: cachix/cachix-action@v17
      if: env.CACHIX_CACHE_NAME != ''
      with:
        name: ${{ env.CACHIX_CACHE_NAME }}

    - name: Build Docker image with Nix
      run: nix build .#scarlet-dev-image

    - name: Smoke test Docker image
      run: |
        docker load < result
        docker run --rm scarlet-dev:latest rustc -vV

  test-riscv32:
    needs: nix-cache
    runs-on: ubuntu-latest
    env:
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        extra_nix_config: |
          accept-flake-config = true
          extra-substituters = https://scarlet-rust-toolchain.cachix.org
          extra-trusted-public-keys = scarlet-rust-toolchain.cachix.org-1:p+coBExi0nNTIvWF/oM9H9/1/GhwFtqGZ2Vs+4pYl6o=

    - uses: cachix/cachix-action@v17
      if: env.CACHIX_CACHE_NAME != ''
      with:
        name: ${{ env.CACHIX_CACHE_NAME }}

    - name: Test scarlet kernel (RV32IMA)
      run: nix develop .#default --command cargo make test-riscv32
      timeout-minutes: 10

  test-riscv64:
    needs: nix-cache
    runs-on: ubuntu-latest
    env:
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        extra_nix_config: |
          accept-flake-config = true
          extra-substituters = https://scarlet-rust-toolchain.cachix.org
          extra-trusted-public-keys = scarlet-rust-toolchain.cachix.org-1:p+coBExi0nNTIvWF/oM9H9/1/GhwFtqGZ2Vs+4pYl6o=

    - uses: cachix/cachix-action@v17
      if: env.CACHIX_CACHE_NAME != ''
      with:
        name: ${{ env.CACHIX_CACHE_NAME }}

    - name: Check all std binaries and legacy SGFX integration (riscv64)
      run: nix develop .#default --command cargo make check-sgfx-riscv64

    - name: Build scarlet kernel (riscv64)
      run: nix develop .#default --command python3 tools/ci-kernel-build.py --arch riscv64

    - name: Test scarlet kernel (riscv64)
      run: nix develop .#default --command cargo make test-riscv64
      timeout-minutes: 10

  test-aarch64:
    needs: nix-cache
    runs-on: ubuntu-latest
    env:
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        extra_nix_config: |
          accept-flake-config = true
          extra-substituters = https://scarlet-rust-toolchain.cachix.org
          extra-trusted-public-keys = scarlet-rust-toolchain.cachix.org-1:p+coBExi0nNTIvWF/oM9H9/1/GhwFtqGZ2Vs+4pYl6o=

    - uses: cachix/cachix-action@v17
      if: env.CACHIX_CACHE_NAME != ''
      with:
        name: ${{ env.CACHIX_CACHE_NAME }}

    - name: Check all std binaries and legacy SGFX integration (aarch64)
      run: nix develop .#default --command cargo make check-sgfx-aarch64

    - name: Build scarlet kernel (aarch64)
      run: nix develop .#default --command python3 tools/ci-kernel-build.py --arch aarch64

    - name: Test scarlet kernel (aarch64)
      run: nix develop .#default --command cargo make test-aarch64
      timeout-minutes: 10

  test-wireless:
    needs: nix-cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [wireless-management, wpa-supplicant, wireless-rekey]
    env:
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        extra_nix_config: |
          accept-flake-config = true
          extra-substituters = https://scarlet-rust-toolchain.cachix.org
          extra-trusted-public-keys = scarlet-rust-toolchain.cachix.org-1:p+coBExi0nNTIvWF/oM9H9/1/GhwFtqGZ2Vs+4pYl6o=
    - uses: cachix/cachix-action@v17
      if: env.CACHIX_CACHE_NAME != ''
      with:
        name: ${{ env.CACHIX_CACHE_NAME }}
    - name: Test Native Wi-Fi in QEMU
      run: nix develop .#default --command python3 tools/test-${{ matrix.suite }}.py

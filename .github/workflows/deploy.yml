name: Docker Image CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: false
        
        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    # Dockerfile と関連ファイルのハッシュを計算
    - name: Generate Docker cache key
      id: docker-cache-key
      run: |
        echo "key=docker-cache-${{ hashFiles('Dockerfile', '.dockerignore', 'flake.nix', 'flake.lock', 'nix/**') }}" >> $GITHUB_OUTPUT
    # Docker キャッシュを復元
    - name: Cache Docker image
      id: docker-cache
      uses: actions/cache@v3
      with:
        path: /tmp/docker-image
        key: ${{ steps.docker-cache-key.outputs.key }}
    # キャッシュがない場合のみビルド
    - name: Build the Docker image
      if: steps.docker-cache.outputs.cache-hit != 'true'
      run: |
        docker build . --file Dockerfile --target ci --tag scarlet-ci \
          --build-arg SCARLET_CACHIX_CACHE="${{ vars.CACHIX_CACHE_NAME }}" \
          --build-arg SCARLET_CACHIX_PUBLIC_KEY="${{ vars.CACHIX_PUBLIC_KEY }}"
        docker save scarlet-ci > /tmp/docker-image
    # キャッシュがある場合はロード
    - name: Load cached Docker image
      if: steps.docker-cache.outputs.cache-hit == 'true'
      run: docker load < /tmp/docker-image
    - name: Make checkout owned by container user
      run: sudo chown -R 0:0 "$PWD"
    - name: Build documentation
      env:
        SCARLET_CACHIX_CACHE: ${{ vars.CACHIX_CACHE_NAME }}
        SCARLET_CACHIX_PUBLIC_KEY: ${{ vars.CACHIX_PUBLIC_KEY }}
      run: |
        docker run \
          -e SCARLET_CACHIX_CACHE \
          -e SCARLET_CACHIX_PUBLIC_KEY \
          -v $PWD:/workspaces/Scarlet \
          scarlet-ci cargo make doc-riscv64
    - name: Remove lock file
      run: |
        docker run \
          -v $PWD:/workspaces/Scarlet \
          scarlet-ci rm kernel/target/riscv64gc-unknown-none-elf/doc/.lock
    - name: Add CNAME file
      run: |
        docker run \
          -v $PWD:/workspaces/Scarlet \
          scarlet-ci /bin/sh -c "echo 'docs.scarlet.ichigo.dev' > kernel/target/riscv64gc-unknown-none-elf/doc/CNAME"
    - name: Restore checkout ownership
      if: always()
      run: sudo chown -R "$USER:$USER" "$PWD"
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: kernel/target/riscv64gc-unknown-none-elf/doc
  
  deploy-doc:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

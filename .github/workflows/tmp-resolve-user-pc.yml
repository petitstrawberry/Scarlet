name: Temporary userspace PC resolver

on:
  push:
    branches:
      - tmp/resolve-user-pc-272bd4-20260812

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    env:
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          ref: tmp/resolve-user-pc-272bd4-20260812

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://scarlet-rust-toolchain.cachix.org
            extra-trusted-public-keys = scarlet-rust-toolchain.cachix.org-1:p+coBExi0nNTIvWF/oM9H9/1/GhwFtqGZ2Vs+4pYl6o=

      - uses: cachix/cachix-action@v17
        if: env.CACHIX_CACHE_NAME != ''
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}

      - name: Build AArch64 userspace binaries
        run: |
          nix develop .#default --command cargo make build-userbin-debug-aarch64
          nix develop .#default --command cargo make build-userbin-release-aarch64

      - name: Resolve sampled userspace PC
        run: |
          nix develop .#default --command python3 - <<'PY' > tmp-pc-resolution.txt
          import os
          import subprocess

          addresses = (0x272BD0, 0x272BD4)
          roots = ("user", "dist", "projects")

          def run(args):
              return subprocess.run(
                  args,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  check=False,
              ).stdout

          def is_aarch64_elf(path):
              header = run(["llvm-readelf", "-h", path])
              return "ELF" in header and "AArch64" in header

          def text_contains(path, address):
              for line in run(["llvm-objdump", "-h", path]).splitlines():
                  fields = line.split()
                  if len(fields) < 5 or not fields[0].isdigit() or "TEXT" not in line:
                      continue
                  try:
                      size = int(fields[2], 16)
                      vma = int(fields[3], 16)
                  except ValueError:
                      continue
                  if vma <= address < vma + size:
                      return True
              return False

          candidates = []
          seen = set()
          for root in roots:
              if not os.path.isdir(root):
                  continue
              for directory, _, filenames in os.walk(root):
                  for filename in filenames:
                      path = os.path.join(directory, filename)
                      if path in seen:
                          continue
                      seen.add(path)
                      try:
                          if os.path.getsize(path) < 4096 or not is_aarch64_elf(path):
                              continue
                      except OSError:
                          continue
                      if any(text_contains(path, address) for address in addresses):
                          candidates.append(path)

          print(f"candidate_count={len(candidates)}")
          for path in sorted(candidates):
              print(f"\n=== {path} ===")
              print("addr2line:")
              print(run(["llvm-addr2line", "-afiC", "-e", path, *map(hex, addresses)]).rstrip())
              print("nearest symbols:")
              symbols = []
              for line in run(["llvm-nm", "-n", "-C", "--defined-only", path]).splitlines():
                  fields = line.split(maxsplit=2)
                  if len(fields) < 2:
                      continue
                  try:
                      value = int(fields[0], 16)
                  except ValueError:
                      continue
                  symbols.append((value, line))
              for target in addresses:
                  print(f"target={target:#x}")
                  before = [item for item in symbols if item[0] <= target]
                  after = [item for item in symbols if item[0] > target]
                  for _, line in before[-6:]:
                      print(line)
                  for _, line in after[:6]:
                      print(line)
              print("disassembly:")
              print(run([
                  "llvm-objdump", "-d", "-C", "--no-show-raw-insn",
                  "--start-address=0x272b80", "--stop-address=0x272c50", path,
              ]).rstrip())
          PY

      - name: Publish result and remove temporary workflow
        run: |
          rm .github/workflows/tmp-resolve-user-pc.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github/workflows/tmp-resolve-user-pc.yml tmp-pc-resolution.txt
          git commit -m "Record temporary userspace PC resolution"
          git push origin HEAD:tmp/resolve-user-pc-272bd4-20260812

name: Apply Waker readiness-latch fix v2

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'automation/fix-local-socket-smp-teardown-20260808'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Coalesce pre-wait notifications
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('kernel/src/sync/waker.rs')
          text = path.read_text()

          old_docs = '''    /// Pending wake count: incremented by wake_one()/wake_all() when the queue
              /// is empty (i.e. the wake arrived before the waiter enqueued itself).
              /// Consumed by wait() so the task does not sleep on an already-fired wake.
              pending_wakes: AtomicUsize,
          '''
          new_docs = '''    /// Pre-wait notification latch. A wake on an empty queue records one
              /// pending notification so the next waiter cannot miss the condition change.
              /// Repeated wakes are coalesced: resource multiplicity lives in the
              /// protected producer state, not in this synchronization primitive.
              pending_wakes: AtomicUsize,
          '''
          if text.count(old_docs) != 1:
              raise RuntimeError('pending wake documentation no longer matches')
          text = text.replace(old_docs, new_docs, 1)

          consume = '''            self.pending_wakes
                          .fetch_update(Ordering::SeqCst, Ordering::SeqCst, |n| {
                              if n > 0 { Some(n - 1) } else { None }
                          })
                          .is_ok()
          '''
          if text.count(consume) != 2:
              raise RuntimeError(f'expected two pending consumers, found {text.count(consume)}')
          text = text.replace(
              consume,
              '''            self.pending_wakes.swap(0, Ordering::SeqCst) != 0
          ''',
          )

          increment = 'self.pending_wakes.fetch_add(1, Ordering::SeqCst);'
          first_increment = text.index(increment)
          text = (
              text[:first_increment]
              + 'self.pending_wakes.store(1, Ordering::SeqCst);'
              + text[first_increment + len(increment):]
          )

          wake_all_start = text.index('    pub fn wake_all(&self) -> usize {')
          wake_all_end = text.index('\n    /// Get the blocking type of this waker', wake_all_start)
          new_wake_all = r'''    pub fn wake_all(&self) -> usize {
                  let mut woken_count = 0;

                  loop {
                      let task_ids = {
                          let mut queue = self.wait_queue.lock();
                          let ids: VecDeque<usize> = queue.drain(..).collect();
                          if ids.is_empty() {
                              if woken_count == 0 {
                                  // A condition notification is a latch, not a
                                  // semaphore permit. Repeated empty-queue wakes
                                  // must not make future waits spin through history.
                                  self.pending_wakes.store(1, Ordering::SeqCst);
                              }
                              return woken_count;
                          }
                          ids
                      };

                      for task_id in task_ids {
                          let woke = self.wake_waiting_task(task_id);
                          if woke {
                              woken_count += 1;
                          }
                          if crate::sched::scheduler::DEBUG_SMP_TASK_FLOW {
                              crate::println!(
                                  "[SMPDBG waker-wake-all] waker={} cpu={} task={} woke={}",
                                  self.name,
                                  crate::arch::get_cpu().get_cpuid(),
                                  task_id,
                                  woke,
                              );
                          }
                      }

                      if woken_count > 0 {
                          return woken_count;
                      }

                      // Every drained entry was stale. Recheck atomically with
                      // queue insertion before publishing the pending latch.
                  }
              }
          '''
          text = text[:wake_all_start] + new_wake_all + text[wake_all_end:]

          marker = '''    #[test_case]
              fn test_wake_one_skips_stale_waiter_before_live_waiter() {
          '''
          test = '''    #[test_case]
              fn test_empty_queue_wakes_coalesce_into_one_latch() {
                  let waker = Waker::new_interruptible("coalesced-pending");

                  assert!(!waker.wake_one());
                  assert!(!waker.wake_one());
                  assert_eq!(waker.wake_all(), 0);
                  assert_eq!(
                      waker.pending_wake_count_for_test(),
                      1,
                      "past readiness notifications must not accumulate"
                  );
              }

          '''
          if text.count(marker) != 1:
              raise RuntimeError('Waker test insertion marker no longer matches')
          text = text.replace(marker, test + marker, 1)

          text = text.replace('Pending wake count', 'Pending wake latch')
          text = text.replace('pending-wake increment', 'pending-wake latch publication')
          text = text.replace('increments pending_wakes', 'sets the pending-wake latch')
          text = text.replace('credit update', 'latch update')
          text = text.replace('that credit belongs to no waiter', 'that latch belongs to no waiter')

          path.write_text(text)
          PY

          rustup component add rustfmt --toolchain nightly-2025-12-31-x86_64-unknown-linux-gnu
          rustfmt --edition 2024 kernel/src/sync/waker.rs

          rm .github/workflows/apply-waker-latch-fix.yml
          rm .github/workflows/apply-waker-latch-fix-v2.yml
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add kernel/src/sync/waker.rs .github/workflows
          git commit -m "fix(sync): coalesce pre-wait notifications"
          git push origin HEAD:${GITHUB_HEAD_REF}

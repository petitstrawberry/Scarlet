fn request_video_picker(request: Arc<Mutex<PickerRequestState>>, shutdown: Arc<AtomicBool>) {
    let mut last_error = None;
    for attempt in 0..FILE_PICKER_RETRY_ATTEMPTS {
        if shutdown.load(Ordering::Acquire) {
            request.lock().reset();
            return;
        }

        let result = SbusConnection::connect().and_then(|mut connection| {
            connection.call_method_timeout(
                DESKTOP_FILE_MANAGER_BUS_NAME,
                DESKTOP_FILE_MANAGER_OBJECT_PATH,
                DESKTOP_FILE_MANAGER_INTERFACE,
                DESKTOP_FILE_MANAGER_OPEN_FILE_METHOD,
                vec![
                    Argument::String(String::from("Open Video")),
                    Argument::String(home_path()),
                    Argument::String(String::from("video/*")),
                    Argument::Boolean(false),
                    Argument::Boolean(false),
                ],
                FILE_PICKER_METHOD_TIMEOUT_MS,
            )
        });

        match result {
            Ok(arguments) => match arguments.first() {
                Some(Argument::String(id)) => {
                    let _ = request.lock().set_waiting(id.clone());
                    return;
                }
                _ => {
                    last_error = Some(sbus_client::Error::ProtocolError(
                        "Files returned no picker request id",
                    ));
                    break;
                }
            },
            // This is the only retry-safe failure. The method was not delivered,
            // so retrying cannot create a duplicate standalone picker process.
            Err(sbus_client::Error::ServiceNotFound) => {
                last_error = Some(sbus_client::Error::ServiceNotFound);
                if attempt == 0
                    && let Err(error) = ensure_files_service()
                {
                    last_error = Some(error);
                }
            }
            // Timeout and I/O failures are ambiguous: Files may already have
            // accepted the request and only its reply was delayed. Do not retry.
            Err(error) => {
                last_error = Some(error);
                break;
            }
        }

        if attempt + 1 < FILE_PICKER_RETRY_ATTEMPTS {
            thread::sleep(Duration::from_millis(FILE_PICKER_RETRY_DELAY_MS));
        }
    }

    request.lock().reset();
    println!("[{}] cannot open video picker: {:?}", APP_NAME, last_error);
}''',

#[cfg(test)]
mod damage_queue_tests {
    use super::*;

    fn native_damage(window_id: u32, x: i32, y: i32, width: u32, height: u32) -> IpcEvent {
        IpcEvent::BufferUpdated {
            window_id,
            damage_x: x,
            damage_y: y,
            damage_width: width,
            damage_height: height,
        }
    }

    #[test]
    fn coalesces_consecutive_native_damage() {
        let mut queue = Vec::new();
        queue.push(native_damage(7, 10, 20, 30, 40));
        let next = native_damage(7, 25, 30, 50, 20);
        assert!(merge_tail_damage_event(&mut queue, &next));
        assert!(queue.len() == 1);

        match &queue[0] {
            IpcEvent::BufferUpdated {
                damage_x,
                damage_y,
                damage_width,
                damage_height,
                ..
            } => {
                assert!(*damage_x == 10);
                assert!(*damage_y == 20);
                assert!(*damage_width == 65);
                assert!(*damage_height == 40);
            }
            _ => panic!("unexpected event"),
        }
    }

    #[test]
    fn does_not_cross_an_ordering_barrier() {
        let mut queue = Vec::new();
        queue.push(native_damage(7, 0, 0, 10, 10));
        queue.push(IpcEvent::SetWindowOpacity {
            window_id: 7,
            opacity: 255,
        });
        let next = native_damage(7, 10, 10, 10, 10);
        assert!(!merge_tail_damage_event(&mut queue, &next));
        assert!(queue.len() == 2);
    }

    #[test]
    fn extension_damage_keeps_client_identity() {
        let mut queue = Vec::new();
        queue.push(IpcEvent::ExtensionUpdateBuffer {
            external_client_id: 1,
            window_id: 9,
            damage_x: 0,
            damage_y: 0,
            damage_width: 10,
            damage_height: 10,
        });
        let next = IpcEvent::ExtensionUpdateBuffer {
            external_client_id: 2,
            window_id: 9,
            damage_x: 5,
            damage_y: 5,
            damage_width: 10,
            damage_height: 10,
        };
        assert!(!merge_tail_damage_event(&mut queue, &next));
    }
}

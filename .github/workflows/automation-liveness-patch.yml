              '''fn merge_tail_damage_event(queue: &mut Vec<IpcEvent>, event: &IpcEvent) -> bool {
    let Some(existing) = queue.last_mut() else {
        return false;
    };

    match (existing, event) {
        (
            IpcEvent::BufferUpdated {
                window_id: existing_window,
                damage_x: existing_x,
                damage_y: existing_y,
                damage_width: existing_width,
                damage_height: existing_height,
            },
            IpcEvent::BufferUpdated {
                window_id,
                damage_x,
                damage_y,
                damage_width,
                damage_height,
            },
        ) if existing_window == window_id => {
            let (x, y, width, height) = merge_damage(
                *existing_x,
                *existing_y,
                *existing_width,
                *existing_height,
                *damage_x,
                *damage_y,
                *damage_width,
                *damage_height,
            );
            *existing_x = x;
            *existing_y = y;
            *existing_width = width;
            *existing_height = height;
            true
        }
        (
            IpcEvent::ExtensionUpdateBuffer {
                external_client_id: existing_client,
                window_id: existing_window,
                damage_x: existing_x,
                damage_y: existing_y,
                damage_width: existing_width,
                damage_height: existing_height,
            },
            IpcEvent::ExtensionUpdateBuffer {
                external_client_id,
                window_id,
                damage_x,
                damage_y,
                damage_width,
                damage_height,
            },
        ) if existing_client == external_client_id && existing_window == window_id => {
            let (x, y, width, height) = merge_damage(
                *existing_x,
                *existing_y,
                *existing_width,
                *existing_height,
                *damage_x,
                *damage_y,
                *damage_width,
                *damage_height,
            );
            *existing_x = x;
            *existing_y = y;
            *existing_width = width;
            *existing_height = height;
            true
        }
        _ => false,
    }
}

/// Add an event to the global queue.
///
/// Consecutive damage notifications for the same backing are unioned at the
/// queue tail. Tail-only coalescing preserves resize, attach, destroy, and
/// other ordering barriers while preventing a presenting client from growing
/// the compositor queue without bound.
pub fn push_ipc_event(event: IpcEvent) {
    let mut queue = EVENT_QUEUE.lock();
    if merge_tail_damage_event(&mut queue, &event) {
        return;
    }

    let should_wake = queue.is_empty();
    queue.push(event);
    drop(queue);
    if should_wake {
        wake_compositor();
    }
}''',

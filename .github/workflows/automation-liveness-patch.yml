#[derive(Debug, PartialEq, Eq)]
enum PickerRequestState {
    Idle,
    Opening,
    Waiting(String),
}

impl PickerRequestState {
    fn begin_open(&mut self) -> bool {
        if !matches!(&*self, Self::Idle) {
            return false;
        }
        *self = Self::Opening;
        true
    }

    fn set_waiting(&mut self, request_id: String) -> bool {
        if !matches!(&*self, Self::Opening) {
            return false;
        }
        *self = Self::Waiting(request_id);
        true
    }

    fn complete(&mut self, response_id: &str) -> bool {
        let matches_request = match self {
            Self::Waiting(request_id) => request_id == response_id,
            Self::Idle | Self::Opening => false,
        };
        if matches_request {
            *self = Self::Idle;
        }
        matches_request
    }

    fn reset(&mut self) {
        *self = Self::Idle;
    }
}


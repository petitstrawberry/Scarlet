name: Apply local socket SMP fix

on:
  push:
    branches:
      - automation/fix-local-socket-smp-teardown-20260808

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apply local socket and sbusd fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          local_path = Path("kernel/src/network/local.rs")
          local = local_path.read_text()

          local = replace_once(
              local,
              '''    /// Waker for blocking recv_handle() operations
              handle_waker: Waker,

              /// Nonblocking I/O flag
          ''',
              '''    /// Waker for blocking recv_handle() operations
              handle_waker: Waker,

              /// Waker for writers blocked on peer receive-buffer capacity.
              write_waker: Waker,

              /// Nonblocking I/O flag
          ''',
              "LocalSocket write_waker field",
          )

          constructor_waker = '            handle_waker: Waker::new_interruptible("socket_handle"),\n'
          constructor_count = local.count(constructor_waker)
          if constructor_count != 4:
              raise RuntimeError(
                  f"LocalSocket constructors: expected four handle wakers, found {constructor_count}"
              )
          local = local.replace(
              constructor_waker,
              constructor_waker
              + '            write_waker: Waker::new_interruptible("socket_write"),\n',
          )

          local = replace_once(
              local,
              '''    pub(crate) fn init_self_weak(this: &Arc<Self>) {
                  *this.self_weak.write() = Arc::downgrade(this);
              }
          ''',
              '''    pub(crate) fn init_self_weak(this: &Arc<Self>) {
                  *this.self_weak.write() = Arc::downgrade(this);
              }

              fn upgrade_peer(&self) -> Option<Arc<Self>> {
                  let peer = self.peer_socket.read();
                  peer.as_ref().and_then(Weak::upgrade)
              }

              fn wake_peer_writer(&self) {
                  if let Some(peer) = self.upgrade_peer() {
                      peer.write_waker.wake_all();
                  }
              }
          ''',
              "LocalSocket peer helpers",
          )

          local = replace_once(
              local,
              '''        // Get peer socket reference
                  let peer_weak = self.peer_socket.read();
                  let peer_weak_ref = peer_weak.as_ref().ok_or(IpcError::PeerClosed)?;
                  let peer = peer_weak_ref.upgrade().ok_or(IpcError::PeerClosed)?;

                  let peer_buffer = peer.read_buffer.read();
                  if *peer_buffer.closed.read() {
                      return Err(IpcError::PeerClosed);
                  }
                  let mut peer_queue = peer_buffer.queue.write();
                  peer_queue.push_handle(object, metadata)?;
                  drop(peer_queue);
                  drop(peer_buffer);

                  // A handle is readable state for recvmsg/select as well as recv_handle.
                  peer.handle_waker.wake_one();
                  peer.read_waker.wake_one();
          ''',
              '''        let peer = self.upgrade_peer().ok_or(IpcError::PeerClosed)?;

                  let peer_buffer = peer.read_buffer.read();
                  if *peer_buffer.closed.read() {
                      return Err(IpcError::PeerClosed);
                  }
                  let mut peer_queue = peer_buffer.queue.write();
                  let became_readable = peer_queue.is_empty();
                  peer_queue.push_handle(object, metadata)?;
                  drop(peer_queue);
                  drop(peer_buffer);

                  // Readiness is level-triggered by the queue state. Wake only on the
                  // empty-to-nonempty edge so stale Waker credits cannot accumulate.
                  if became_readable {
                      peer.handle_waker.wake_one();
                      peer.read_waker.wake_one();
                  }
          ''',
              "send_handle readiness edge",
          )

          local = replace_once(
              local,
              '''        // Get peer socket reference
                  let peer_weak = self.peer_socket.read();
                  let peer_weak_ref = peer_weak.as_ref().ok_or(IpcError::PeerClosed)?;
                  let peer = peer_weak_ref.upgrade().ok_or(IpcError::PeerClosed)?;

                  let peer_buffer = peer.read_buffer.read();
                  if *peer_buffer.closed.read() {
                      return Err(IpcError::PeerClosed);
                  }
                  let mut peer_queue = peer_buffer.queue.write();
                  peer_queue.push_handle_data(object, metadata, data)?;
                  drop(peer_queue);
                  drop(peer_buffer);

                  // Wake the peer after BOTH handle and data are available
                  peer.handle_waker.wake_one();
                  peer.read_waker.wake_one();
          ''',
              '''        let peer = self.upgrade_peer().ok_or(IpcError::PeerClosed)?;

                  let peer_buffer = peer.read_buffer.read();
                  if *peer_buffer.closed.read() {
                      return Err(IpcError::PeerClosed);
                  }
                  let mut peer_queue = peer_buffer.queue.write();
                  let became_readable = peer_queue.is_empty();
                  peer_queue.push_handle_data(object, metadata, data)?;
                  drop(peer_queue);
                  drop(peer_buffer);

                  // Wake after the complete record becomes the first readable item.
                  if became_readable {
                      peer.handle_waker.wake_one();
                      peer.read_waker.wake_one();
                  }
          ''',
              "send_handle_and_data readiness edge",
          )

          stream_start = local.index("impl StreamOps for LocalSocket {")
          stream_end = local.index("\nimpl StreamIpcOps for LocalSocket {", stream_start)
          new_stream_impl = r'''impl StreamOps for LocalSocket {
              fn read(&self, buffer: &mut [u8]) -> Result<usize, StreamError> {
                  use crate::task::mytask;

                  if buffer.is_empty() {
                      return Ok(0);
                  }

                  loop {
                      let (bytes_to_read, blocked_by_ordered_segment, freed_full_buffer) = {
                          let read_buf_arc = self.read_buffer.read();
                          let mut queue = read_buf_arc.queue.write();
                          let was_full = queue.stream_bytes == MAX_STREAM_BUFFER_SIZE;
                          let bytes_to_read = queue.read_bytes(buffer);
                          let blocked_by_ordered_segment =
                              bytes_to_read.is_none() && !queue.is_empty();
                          let freed_full_buffer =
                              was_full && matches!(bytes_to_read, Some(bytes) if bytes > 0);
                          (
                              bytes_to_read,
                              blocked_by_ordered_segment,
                              freed_full_buffer,
                          )
                      };

                      if let Some(bytes_to_read) = bytes_to_read {
                          // Writers wait only while the byte queue is full. Wake them on
                          // the full-to-not-full transition, not after every read, so the
                          // Waker cannot collect stale readiness credits.
                          if freed_full_buffer {
                              self.wake_peer_writer();
                          }
                          return Ok(bytes_to_read);
                      }

                      // A different ordered segment is first. Let the protocol
                      // dispatcher select recv_handle/recv_handle_and_data instead.
                      if blocked_by_ordered_segment {
                          return Err(StreamError::WouldBlock);
                      }

                      {
                          let read_buf_arc = self.read_buffer.read();

                          // EOF is a completed read condition, including on a
                          // non-blocking socket.
                          let my_state = *self.state.read();
                          if my_state == SocketState::Closed {
                              return Ok(0);
                          }

                          if my_state == SocketState::Connected {
                              let peer_closed = match self.peer_socket.read().as_ref() {
                                  Some(peer_weak) => match peer_weak.upgrade() {
                                      Some(peer) => *peer.state.read() == SocketState::Closed,
                                      None => true,
                                  },
                                  None => true,
                              };
                              if peer_closed {
                                  return Ok(0);
                              }
                          }

                          if *read_buf_arc.closed.read() {
                              return Ok(0);
                          }
                      }

                      if *self.nonblocking.read() {
                          return Err(StreamError::WouldBlock);
                      }

                      if let Some(task) = mytask() {
                          self.read_waker.wait(task.get_id(), task.get_trapframe());
                      } else {
                          return Err(StreamError::WouldBlock);
                      }
                  }
              }

              fn write(&self, data: &[u8]) -> Result<usize, StreamError> {
                  use crate::task::mytask;

                  if data.is_empty() {
                      return Ok(0);
                  }

                  loop {
                      if *self.state.read() == SocketState::Closed {
                          return Err(StreamError::Closed);
                      }

                      let peer = self.upgrade_peer().ok_or(StreamError::Closed)?;
                      let peer_buffer = self
                          .peer_read_buffer
                          .read()
                          .as_ref()
                          .cloned()
                          .ok_or(StreamError::Closed)?;
                      if *peer_buffer.closed.read() {
                          return Err(StreamError::Closed);
                      }

                      let (bytes_written, became_readable) = {
                          let mut peer_queue = peer_buffer.queue.write();
                          let available =
                              MAX_STREAM_BUFFER_SIZE.saturating_sub(peer_queue.stream_bytes);
                          if available == 0 {
                              (0, false)
                          } else {
                              let bytes_written = available.min(data.len());
                              let became_readable = peer_queue.is_empty();
                              peer_queue.push_bytes(&data[..bytes_written])?;
                              (bytes_written, became_readable)
                          }
                      };

                      if bytes_written > 0 {
                          // Queue state carries level readiness. Only publish the
                          // empty-to-nonempty transition to avoid stale wake credits.
                          if became_readable {
                              peer.read_waker.wake_one();
                          }
                          return Ok(bytes_written);
                      }

                      // Do not retain an Arc to the peer while sleeping. The last
                      // peer handle must be able to run Drop and wake this writer.
                      drop(peer_buffer);
                      drop(peer);

                      if *self.nonblocking.read() {
                          return Err(StreamError::WouldBlock);
                      }

                      if let Some(task) = mytask() {
                          self.write_waker.wait(task.get_id(), task.get_trapframe());
                      } else {
                          return Err(StreamError::WouldBlock);
                      }
                  }
              }
          }
          '''
          local = local[:stream_start] + new_stream_impl + local[stream_end:]

          drop_start = local.index("impl Drop for LocalSocket {")
          drop_end = local.index("\nimpl SocketControl for LocalSocket {", drop_start)
          new_drop_impl = r'''impl Drop for LocalSocket {
              fn drop(&mut self) {
                  let state = *self.state.read();

                  if matches!(state, SocketState::Bound | SocketState::Listening)
                      && let Some(path) = self.local_addr.read().as_ref()
                      && !path.is_empty()
                  {
                      NetworkManager::get_manager().unregister_named_socket(path);
                  }

                  // Publish closure before waking either endpoint.
                  *self.state.write() = SocketState::Closed;

                  // Never acquire locks inside the peer while retaining one of this
                  // endpoint's peer-reference locks. Concurrent endpoint teardown on
                  // different CPUs otherwise forms A.peer_socket -> B.peer_socket and
                  // B.peer_socket -> A.peer_socket lock inversion.
                  let own_read_buffer = self.read_buffer.read().clone();
                  let peer_read_buffer = self.peer_read_buffer.write().take();
                  let peer = self
                      .peer_socket
                      .write()
                      .take()
                      .and_then(|peer| peer.upgrade());

                  // The peer writes into our read buffer, while we write into the
                  // peer read buffer. Closing both shared buffers communicates EOF
                  // and broken-pipe state without mutating the peer's link fields.
                  *own_read_buffer.closed.write() = true;
                  if let Some(peer_read_buffer) = peer_read_buffer.as_ref() {
                      *peer_read_buffer.closed.write() = true;
                  }

                  if let Some(peer) = peer {
                      peer.read_waker.wake_all();
                      peer.handle_waker.wake_all();
                      peer.write_waker.wake_all();
                  }

                  self.accept_waker.wake_all();
                  self.read_waker.wake_all();
                  self.handle_waker.wake_all();
                  self.write_waker.wake_all();

                  NetworkManager::get_manager().remove_socket_by_ptr(self as *const Self as usize);
              }
          }
          '''
          local = local[:drop_start] + new_drop_impl + local[drop_end:]

          shutdown_start = local.index(
              "    fn shutdown(&self, how: ShutdownHow) -> Result<(), SocketError> {"
          )
          shutdown_end = local.index("\n    fn is_connected(&self) -> bool {", shutdown_start)
          new_shutdown = r'''    fn shutdown(&self, how: ShutdownHow) -> Result<(), SocketError> {
                  if *self.state.read() != SocketState::Connected {
                      return Err(SocketError::NotConnected);
                  }

                  match how {
                      ShutdownHow::Read => {
                          let read_buffer = self.read_buffer.read().clone();
                          *read_buffer.closed.write() = true;
                          self.read_waker.wake_all();
                          self.handle_waker.wake_all();
                          if let Some(peer) = self.upgrade_peer() {
                              peer.write_waker.wake_all();
                          }
                          Ok(())
                      }
                      ShutdownHow::Write => {
                          let peer_read_buffer = self.peer_read_buffer.read().as_ref().cloned();
                          if let Some(peer_read_buffer) = peer_read_buffer {
                              *peer_read_buffer.closed.write() = true;
                          }
                          if let Some(peer) = self.upgrade_peer() {
                              peer.read_waker.wake_all();
                              peer.handle_waker.wake_all();
                          }
                          self.write_waker.wake_all();
                          Ok(())
                      }
                      ShutdownHow::Both => {
                          *self.state.write() = SocketState::Closed;

                          let read_buffer = self.read_buffer.read().clone();
                          *read_buffer.closed.write() = true;
                          let peer_read_buffer = self.peer_read_buffer.read().as_ref().cloned();
                          if let Some(peer_read_buffer) = peer_read_buffer {
                              *peer_read_buffer.closed.write() = true;
                          }

                          if let Some(peer) = self.upgrade_peer() {
                              peer.read_waker.wake_all();
                              peer.handle_waker.wake_all();
                              peer.write_waker.wake_all();
                          }
                          self.read_waker.wake_all();
                          self.handle_waker.wake_all();
                          self.write_waker.wake_all();
                          Ok(())
                      }
                  }
              }
          '''
          local = local[:shutdown_start] + new_shutdown + local[shutdown_end:]

          local = replace_once(
              local,
              '''            SocketState::Connected if interest.write => {
                          let write_closed = match self.peer_read_buffer.read().as_ref() {
                              Some(peer_buffer) => *peer_buffer.closed.read(),
                              None => true,
                          };
                          return if write_closed {
                              SelectWaitOutcome::TimedOut
                          } else {
                              SelectWaitOutcome::Ready
                          };
                      }
          ''',
              '''            SocketState::Connected if interest.write => {
                          if min_wait_ticks > 0 {
                              self.write_waker.wait_with_min_timeout(
                                  task_id,
                                  trapframe,
                                  timeout_ticks,
                                  min_wait_ticks,
                              )
                          } else {
                              self.write_waker
                                  .wait_with_timeout(task_id, trapframe, timeout_ticks)
                          }
                      }
          ''',
              "POLLOUT blocking wait",
          )

          test_marker = '''    #[test_case]
              fn test_handle_transfer_send_recv() {
          '''
          test_insert = '''    #[test_case]
              fn test_nonblocking_write_backpressure_recovers_after_peer_read() {
                  let (writer, reader) =
                      LocalSocket::create_connected_pair("server".to_string(), "client".to_string());
                  writer.set_nonblocking(true);

                  let payload = alloc::vec![0x5a; MAX_STREAM_BUFFER_SIZE + 1];
                  assert_eq!(writer.write(&payload).unwrap(), MAX_STREAM_BUFFER_SIZE);
                  assert!(matches!(
                      writer.write(&payload[MAX_STREAM_BUFFER_SIZE..]),
                      Err(StreamError::WouldBlock)
                  ));
                  assert!(
                      !writer.current_ready(ReadyInterest::write()).write,
                      "a full peer buffer must not report POLLOUT"
                  );

                  let mut byte = [0u8; 1];
                  assert_eq!(reader.read(&mut byte).unwrap(), 1);
                  assert!(
                      writer.current_ready(ReadyInterest::write()).write,
                      "peer consumption must restore POLLOUT"
                  );
                  assert_eq!(writer.write(&payload[..1]).unwrap(), 1);
              }

          ''' + test_marker
          local = replace_once(
              local,
              test_marker,
              test_insert,
              "local socket backpressure regression test",
          )

          local_path.write_text(local)

          sbusd_path = Path("user/bin/src/sbusd/main.rs")
          sbusd = sbusd_path.read_text()
          write_marker = "/// Write all bytes to socket\nfn write_all(socket: &mut Socket, bytes: &[u8]) -> Result<(), &'static str> {"
          write_start = sbusd.index(write_marker)
          new_write_all = r'''/// Read the monotonic clock used for write-stall deadlines.
          fn monotonic_time_ns() -> u64 {
              use std::syscall::{Syscall, syscall0};

              syscall0(Syscall::MonotonicTime) as u64
          }

          /// Write all bytes to socket.
          fn write_all(socket: &mut Socket, bytes: &[u8]) -> Result<(), &'static str> {
              let mut written = 0;
              let raw_handle = socket.as_raw() as u32;
              let mut stall_deadline_ns =
                  monotonic_time_ns().saturating_add(CLIENT_WRITE_TIMEOUT_NS);

              while written < bytes.len() {
                  match socket.write(&bytes[written..]) {
                      Ok(0) => {
                          println!("[write_all] Write returned 0 (disconnected)");
                          let _ = socket.shutdown(ShutdownHow::Both);
                          return Err("Failed to send: disconnected");
                      }
                      Ok(n) => {
                          written += n;
                          stall_deadline_ns =
                              monotonic_time_ns().saturating_add(CLIENT_WRITE_TIMEOUT_NS);
                          println!("[write_all] Wrote {} bytes (total: {})", n, written);
                      }
                      Err(e) if e.kind() == ErrorKind::WouldBlock => {
                          let now_ns = monotonic_time_ns();
                          if now_ns >= stall_deadline_ns {
                              println!(
                                  "[write_all] Timed out after {}ms (wrote {} of {} bytes)",
                                  CLIENT_WRITE_TIMEOUT_MS,
                                  written,
                                  bytes.len()
                              );
                              let _ = socket.shutdown(ShutdownHow::Both);
                              return Err("Failed to send: timed out");
                          }

                          // A readiness wait may return spuriously. Derive the
                          // timeout from the monotonic deadline instead of adding
                          // the requested poll slice to a synthetic elapsed counter.
                          let remaining_ns = stall_deadline_ns.saturating_sub(now_ns);
                          let slice_ns = remaining_ns.min(CLIENT_WRITE_POLL_SLICE_NS) as i64;
                          let mut poll_handles = [PollHandle::new(raw_handle, POLLOUT)];
                          if let Err(code) = poll(&mut poll_handles, slice_ns) {
                              println!("[write_all] Poll error while waiting to write: {}", code);
                              let _ = socket.shutdown(ShutdownHow::Both);
                              return Err("Failed to wait for writable socket");
                          }
                          if poll_handles[0].revents & (POLLERR | POLLHUP | POLLNVAL) != 0 {
                              // Retry once so the socket operation reports the
                              // precise disconnect/broken-pipe condition.
                          }
                      }
                      Err(e) => {
                          println!("[write_all] Write error: {:?}", e);
                          let _ = socket.shutdown(ShutdownHow::Both);
                          return Err("Failed to send");
                      }
                  }
              }
              Ok(())
          }
          '''
          sbusd = sbusd[:write_start] + new_write_all
          sbusd_path.write_text(sbusd)
          PY

          rustfmt --edition 2024 kernel/src/network/local.rs user/bin/src/sbusd/main.rs

          rm .github/workflows/apply-local-socket-smp-fix.yml
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add kernel/src/network/local.rs user/bin/src/sbusd/main.rs .github/workflows/apply-local-socket-smp-fix.yml
          git commit -m "fix(ipc): make local socket teardown and POLLOUT SMP-safe"
          git push origin HEAD:${GITHUB_REF_NAME}

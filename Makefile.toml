cwd = "user/bin"
command = "cargo"
args = ["make", "build-release-aarch64"]
dependencies = ["build-userlib-release-aarch64"]

[tasks.build-userbin-riscv64]
description = "Build user programs (RISC-V, debug)"
dependencies = ["build-userbin-debug-riscv64"]

[tasks.build-userbin-aarch64]
description = "Build user programs (AArch64, debug)"
dependencies = ["build-userbin-debug-aarch64"]

[tasks.clean]
description = "Clean all build artifacts"
dependencies = ["clean-kernel", "clean-project-riscv64", "clean-project-aarch64", "clean-project-aarch64-microvm", "clean-userlib", "clean-userbin", "clean-modules", "clean-initramfs", "clean-rootfs", "clean-boot-image-riscv64", "clean-boot-image-aarch64"]

[tasks.clean-kernel]
description = "Clean kernel build artifacts"
cwd = "kernel"
command = "cargo"
args = ["clean"]

[tasks.clean-project-riscv64]
description = "Clean RISC-V project build artifacts"
cwd = "projects/riscv64-limine-full"
command = "cargo"
args = ["clean"]

[tasks.clean-project-aarch64]
description = "Clean AArch64 project build artifacts"
cwd = "projects/aarch64-limine-full"
command = "cargo"
args = ["clean"]

[tasks.clean-project-aarch64-microvm]
description = "Clean AArch64 microvm project build artifacts"
cwd = "projects/aarch64-limine-microvm"
command = "cargo"
args = ["clean"]

[tasks.clean-userlib]
description = "Clean user library build artifacts"
cwd = "user/lib"
command = "cargo"
args = ["make", "clean"]

[tasks.clean-userbin]
description = "Clean user program build artifacts"
cwd = "user/bin"
command = "cargo"
args = ["clean"]

[tasks.clean-modules]
description = "Clean loadable module build artifacts and dist"
script_runner = "@shell"
script = '''
for dir in modules/loadable/*/; do
  [ -d "$dir" ] && cargo clean --manifest-path "${dir}Cargo.toml" 2>/dev/null
done
rm -rf mkfs/dist/modules
'''

[tasks.test-riscv64]
description = "Run tests (RISC-V)"
dependencies = ["test-kernel-riscv64"]

[tasks.test-aarch64]
description = "Run tests (AArch64)"
dependencies = ["test-kernel-aarch64"]

[tasks.test-kernel-riscv64]
description = "Run kernel tests (RISC-V)"
cwd = "kernel"
env = { "CARGO_TARGET_RISCV64GC_UNKNOWN_NONE_ELF_RUNNER" = "tools/test.sh" }
command = "cargo"
args = ["test", "--target", "targets/riscv64gc-unknown-none-elf.json"]
dependencies = ["build-initramfs-debug-riscv64", "build-rootfs-riscv64"]

[tasks.test-kernel-aarch64]

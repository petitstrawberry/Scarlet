command = "sh"
args = ["make_limine_riscv64_image.sh"]
dependencies = ["build-kernel-debug-riscv64", "build-initramfs-debug-riscv64", "build-rootfs-riscv64"]

[tasks.build-boot-image-riscv64-release]
description = "Create boot image (RISC-V, release kernel)"
cwd = "mkfs"
command = "sh"
args = ["make_limine_riscv64_image.sh"]

args = ["run", "--manifest-path", "cargo-scarlet/Cargo.toml", "--", "run", "--project", "projects/aarch64-limine-microvm", "--release"]
dependencies = ["build-userbin-release-aarch64"]

[tasks.run-debug-riscv64]

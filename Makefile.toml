cwd = "user/bin"
command = "cargo"
args = ["make", "build"]
dependencies = ["build-userlib-debug-riscv64"]

[tasks.build-userbin-debug-aarch64]
description = "Build user programs for AArch64 in debug mode"
cwd = "user/bin"

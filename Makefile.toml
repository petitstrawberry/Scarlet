[tasks.build-riscv64]
description = "Build all components (RISC-V, debug)"
dependencies = ["build-debug-riscv64"]

[tasks.build-aarch64]
description = "Build all components (AArch64, debug)"
dependencies = ["build-debug-aarch64"]

[tasks.build-host-tools]
description = "Build host-side helper tools"
dependencies = ["build-vhost-video-videotoolbox"]

[tasks.build-vhost-video-videotoolbox]
description = "Build the macOS VideoToolbox vhost-user video daemon"
cwd = "tools/vhost-video-videotoolbox"
script_runner = "@shell"
script = '''
mkdir -p .build/clang-module-cache
env -u DEVELOPER_DIR -u SDKROOT CLANG_MODULE_CACHE_PATH=.build/clang-module-cache /usr/bin/xcrun swift build --disable-sandbox -c release --product vhost-video-videotoolbox
mkdir -p ../../dist/host
cp .build/release/vhost-video-videotoolbox ../../dist/host/vhost_video_videotoolbox
'''

[tasks.run-vhost-video-videotoolbox]
description = "Run the macOS VideoToolbox vhost-user video daemon"
cwd = "tools/vhost-video-videotoolbox"
script_runner = "@shell"
script = '''
mkdir -p .build/clang-module-cache
env -u DEVELOPER_DIR -u SDKROOT CLANG_MODULE_CACHE_PATH=.build/clang-module-cache /usr/bin/xcrun swift run --disable-sandbox vhost-video-videotoolbox --socket "${SCARLET_VHOST_USER_VIDEO_SOCKET:-/private/tmp/scarlet-video.sock}"
'''


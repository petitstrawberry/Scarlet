dependencies = ["build-kernel-debug-riscv64"]

[tasks.build-kernel-aarch64]
description = "Build the kernel (AArch64, debug)"
dependencies = ["build-kernel-debug-aarch64"]

[tasks.build-kernel-debug-riscv64]
description = "Build the kernel in debug mode (RISC-V) with post-link ksym injection"
script_runner = "@shell"
script = '''
cargo run --manifest-path cargo-scarlet/Cargo.toml -- build --project projects/riscv64-limine-full
'''

[tasks.build-kernel-debug-aarch64]
description = "Build the kernel in debug mode (AArch64) with post-link ksym injection"
script_runner = "@shell"
script = '''
cargo run --manifest-path cargo-scarlet/Cargo.toml -- build --project projects/aarch64-limine-full
'''

[tasks.build-kernel-debug-aarch64-microvm]
description = "Build the kernel in debug mode (AArch64 microvm) with post-link ksym injection"
script_runner = "@shell"
script = '''
cargo run --manifest-path cargo-scarlet/Cargo.toml -- build --project projects/aarch64-limine-microvm
'''

[tasks.build-kernel-release-riscv64]
description = "Build the kernel in release mode (RISC-V) with post-link ksym injection"
script_runner = "@shell"
script = '''
cargo run --manifest-path cargo-scarlet/Cargo.toml -- build --project projects/riscv64-limine-full --release
'''

[tasks.build-kernel-release-aarch64]
description = "Build the kernel in release mode (AArch64) with post-link ksym injection"
script_runner = "@shell"
script = '''
cargo run --manifest-path cargo-scarlet/Cargo.toml -- build --project projects/aarch64-limine-full --release
'''

[tasks.build-kernel-release-aarch64-microvm]
description = "Build the kernel in release mode (AArch64 microvm) with post-link ksym injection"
script_runner = "@shell"
script = '''
cargo run --manifest-path cargo-scarlet/Cargo.toml -- build --project projects/aarch64-limine-microvm --release
'''

[tasks.generate-project-riscv64]
description = "Validate and refresh project-local scarlet-modules for RISC-V"
command = "cargo"
args = ["run", "--manifest-path", "cargo-scarlet/Cargo.toml", "--", "check", "--project", "projects/riscv64-limine-full"]

[tasks.generate-project-aarch64]
description = "Validate and refresh project-local scarlet-modules for AArch64"
command = "cargo"
args = ["run", "--manifest-path", "cargo-scarlet/Cargo.toml", "--", "check", "--project", "projects/aarch64-limine-full"]

[tasks.generate-project-aarch64-microvm]
description = "Validate and refresh project-local scarlet-modules for AArch64 microvm"
command = "cargo"
args = ["run", "--manifest-path", "cargo-scarlet/Cargo.toml", "--", "check", "--project", "projects/aarch64-limine-microvm"]

[tasks.image-aarch64-microvm]
description = "Build AArch64 microvm project image from project-local image recipe"
command = "cargo"
args = ["run", "--manifest-path", "cargo-scarlet/Cargo.toml", "--", "image", "--project", "projects/aarch64-limine-microvm", "--release"]
dependencies = ["build-userbin-release-aarch64"]

[tasks.build-userlib-debug-riscv64]
description = "Build user libraries for RISC-V in debug mode"
cwd = "user/lib"
command = "cargo"
args = ["make", "build-userlib-debug"]

[tasks.build-userlib-release-riscv64]
description = "Build user libraries for RISC-V in release mode"
cwd = "user/lib"
command = "cargo"
args = ["make", "build-userlib-release"]

[tasks.build-userlib-debug-aarch64]
description = "Build user libraries for AArch64 in debug mode"
cwd = "user/lib"
command = "cargo"
args = ["make", "build-userlib-debug-aarch64"]

[tasks.build-userlib-release-aarch64]
description = "Build user libraries for AArch64 in release mode"
cwd = "user/lib"
command = "cargo"
args = ["make", "build-userlib-release-aarch64"]

[tasks.build-userlib-riscv64]
description = "Build user libraries (RISC-V, debug)"
dependencies = ["build-userlib-debug-riscv64"]

[tasks.build-userlib-aarch64]
description = "Build user libraries (AArch64, debug)"
dependencies = ["build-userlib-debug-aarch64"]

[tasks.build-modules-debug-riscv64]
description = "Copy loadable modules (.lsm) for RISC-V (built by project)"
dependencies = ["build-kernel-debug-riscv64"]
script_runner = "@shell"
script = '''
mkdir -p mkfs/dist/modules/riscv64gc-unknown-none-elf
for dir in modules/loadable/*/; do
  name=$(basename "$dir")
  src="${dir}target/riscv64gc-unknown-none-elf/debug/${name}.lsm"
  if [ -f "$src" ]; then cp "$src" mkfs/dist/modules/riscv64gc-unknown-none-elf/; fi
done
'''

[tasks.build-modules-debug-aarch64]
description = "Copy loadable modules (.lsm) for AArch64 (built by project)"
dependencies = ["build-kernel-debug-aarch64"]
script_runner = "@shell"
script = '''
mkdir -p mkfs/dist/modules/aarch64-unknown-none-elf
for dir in modules/loadable/*/; do
  name=$(basename "$dir")
  src="${dir}target/aarch64-unknown-none-elf/debug/${name}.lsm"
  if [ -f "$src" ]; then cp "$src" mkfs/dist/modules/aarch64-unknown-none-elf/; fi
done
'''

[tasks.build-modules-release-riscv64]
description = "Copy loadable modules (.lsm) for RISC-V (built by project)"
dependencies = ["build-kernel-release-riscv64"]
script_runner = "@shell"
script = '''
mkdir -p mkfs/dist/modules/riscv64gc-unknown-none-elf
for dir in modules/loadable/*/; do
  name=$(basename "$dir")
  src="${dir}target/riscv64gc-unknown-none-elf/release/${name}.lsm"
  if [ -f "$src" ]; then cp "$src" mkfs/dist/modules/riscv64gc-unknown-none-elf/; fi
done
'''

[tasks.build-modules-release-aarch64]
description = "Copy loadable modules (.lsm) for AArch64 (built by project)"
dependencies = ["build-kernel-release-aarch64"]
script_runner = "@shell"
script = '''
mkdir -p mkfs/dist/modules/aarch64-unknown-none-elf
for dir in modules/loadable/*/; do
  name=$(basename "$dir")
  src="${dir}target/aarch64-unknown-none-elf/release/${name}.lsm"
  if [ -f "$src" ]; then cp "$src" mkfs/dist/modules/aarch64-unknown-none-elf/; fi
done
'''


[env]
# Environment variable settings for build
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true
CARGO_MAKE_WORKSPACE_INCLUDE_MEMBERS = ["kernel", "bsp/riscv64-limine", "bsp/aarch64-limine", "user/lib/std", "user/bin"]

[config]
default_task = "build-riscv64"
skip_core_tasks = true

[tasks.fmt]
description = "Format all code"
dependencies = ["fmt-kernel", "fmt-bsp-riscv64", "fmt-bsp-aarch64", "fmt-userlib", "fmt-userbin"]

[tasks.fmt-check]
description = "Check formatting (no changes)"
dependencies = ["fmt-kernel-check", "fmt-bsp-riscv64-check", "fmt-bsp-aarch64-check", "fmt-userlib-check", "fmt-userbin-check"]

[tasks.fmt-kernel-check]
description = "Check kernel formatting"
cwd = "kernel"
command = "cargo"
args = ["fmt", "--", "--check"]

[tasks.fmt-bsp-riscv64-check]
description = "Check RISC-V BSP formatting"
cwd = "bsp/riscv64-limine"
command = "cargo"
args = ["fmt", "--", "--check"]

[tasks.fmt-bsp-aarch64-check]
description = "Check AArch64 BSP formatting"
cwd = "bsp/aarch64-limine"
command = "cargo"
args = ["fmt", "--", "--check"]

[tasks.fmt-userlib-check]
description = "Check user library formatting by calling sub Makefile.toml"
cwd = "user/lib"
command = "cargo"
args = ["make", "fmt-check"]

[tasks.fmt-userbin-check]
description = "Check user program formatting"
cwd = "user/bin"
command = "cargo"
args = ["make", "fmt-check"]

[tasks.clippy-riscv64]
description = "Run clippy for all components (RISC-V)"
dependencies = ["clippy-kernel", "clippy-bsp-riscv64", "clippy-userlib", "clippy-userbin"]

[tasks.clippy-aarch64]
description = "Run clippy for all components (AArch64)"
dependencies = ["clippy-kernel", "clippy-bsp-aarch64", "clippy-userlib", "clippy-userbin"]

[tasks.clippy-kernel]
description = "Run clippy for kernel"
cwd = "kernel"
command = "cargo"
args = ["clippy", "--", "-D", "warnings"]

[tasks.clippy-bsp-riscv64]
description = "Run clippy for RISC-V BSP"
cwd = "bsp/riscv64-limine"
command = "cargo"
args = ["clippy", "--target", "../../kernel/targets/riscv64gc-unknown-none-elf.json", "--", "-D", "warnings"]

[tasks.clippy-bsp-aarch64]
description = "Run clippy for AArch64 BSP"
cwd = "bsp/aarch64-limine"
command = "cargo"
args = ["clippy", "--target", "../../kernel/targets/aarch64-unknown-none-elf.json", "--", "-D", "warnings"]

[tasks.clippy-userlib]
description = "Run clippy for user libraries by calling sub Makefile.toml"
cwd = "user/lib"
command = "cargo"
args = ["make", "clippy"]

[tasks.clippy-userbin]
description = "Run clippy for user programs by calling sub Makefile.toml"
cwd = "user/bin"
command = "cargo"
args = ["make", "clippy"]
[tasks.fmt-kernel]
description = "Format kernel code"
cwd = "kernel"
command = "cargo"
args = ["fmt"]

[tasks.fmt-bsp-riscv64]
description = "Format RISC-V BSP code"
cwd = "bsp/riscv64-limine"
command = "cargo"
args = ["fmt"]

[tasks.fmt-bsp-aarch64]
description = "Format AArch64 BSP code"
cwd = "bsp/aarch64-limine"
command = "cargo"
args = ["fmt"]

[tasks.fmt-userlib]
description = "Format user library code"
cwd = "user/lib"
command = "cargo"
args = ["make", "fmt"]

[tasks.fmt-userbin]
description = "Format user program code"
cwd = "user/bin"
command = "cargo"
args = ["make", "fmt"]

[tasks.build-riscv64]
description = "Build all components (RISC-V, debug)"
dependencies = ["build-debug-riscv64"]

[tasks.build-aarch64]
description = "Build all components (AArch64, debug)"
dependencies = ["build-debug-aarch64"]

[tasks.build-debug-riscv64]
description = "Build all components in debug mode (RISC-V)"
dependencies = ["build-kernel-debug-riscv64", "build-userlib-debug-riscv64", "build-userbin-debug-riscv64", "build-initramfs-debug-riscv64", "build-rootfs-riscv64", "build-boot-image-riscv64"]

[tasks.build-release-riscv64]
description = "Build all components in release mode (RISC-V)"
dependencies = ["build-kernel-release-riscv64", "build-userlib-release-riscv64", "build-userbin-release-riscv64", "build-initramfs-release-riscv64", "build-rootfs-riscv64", "build-boot-image-riscv64-release"]

[tasks.build-debug-aarch64]
description = "Build all components in debug mode (AArch64)"
dependencies = ["build-kernel-debug-aarch64", "build-userlib-debug-aarch64", "build-userbin-debug-aarch64", "build-initramfs-debug-aarch64", "build-rootfs-aarch64", "build-boot-image-aarch64"]

[tasks.build-release-aarch64]
description = "Build all components in release mode (AArch64)"
dependencies = ["build-kernel-release-aarch64", "build-userlib-release-aarch64", "build-userbin-release-aarch64", "build-initramfs-release-aarch64", "build-rootfs-aarch64", "build-boot-image-aarch64-release"]

[tasks.build-kernel-riscv64]
description = "Build the kernel (RISC-V, debug)"
dependencies = ["build-kernel-debug-riscv64"]

[tasks.build-kernel-aarch64]
description = "Build the kernel (AArch64, debug)"
dependencies = ["build-kernel-debug-aarch64"]

[tasks.build-kernel-debug-riscv64]
description = "Build the kernel in debug mode (RISC-V)"
cwd = "bsp/riscv64-limine"
command = "cargo"
args = ["build", "--target", "../../kernel/targets/riscv64gc-unknown-none-elf.json"]

[tasks.build-kernel-debug-aarch64]
description = "Build the kernel in debug mode (AArch64)"
cwd = "bsp/aarch64-limine"
command = "cargo"
args = ["build", "--target", "../../kernel/targets/aarch64-unknown-none-elf.json"]

[tasks.build-kernel-release-riscv64]
description = "Build the kernel in release mode (RISC-V)"
cwd = "bsp/riscv64-limine"
command = "cargo"
args = ["build", "--release", "--target", "../../kernel/targets/riscv64gc-unknown-none-elf.json"]

[tasks.build-kernel-release-aarch64]
description = "Build the kernel in release mode (AArch64)"
cwd = "bsp/aarch64-limine"
command = "cargo"
args = ["build", "--release", "--target", "../../kernel/targets/aarch64-unknown-none-elf.json"]

[tasks.build-userlib-debug-riscv64]
description = "Build user libraries for RISC-V in debug mode"
cwd = "user/lib"
command = "cargo"
args = ["make", "build-userlib-debug"]

[tasks.build-userlib-release-riscv64]
description = "Build user libraries for RISC-V in release mode"
cwd = "user/lib"
command = "cargo"
args = ["make", "build-userlib-release"]

[tasks.build-userlib-debug-aarch64]
description = "Build user libraries for AArch64 in debug mode"
cwd = "user/lib"
command = "cargo"
args = ["make", "build-userlib-debug-aarch64"]

[tasks.build-userlib-release-aarch64]
description = "Build user libraries for AArch64 in release mode"
cwd = "user/lib"
command = "cargo"
args = ["make", "build-userlib-release-aarch64"]

[tasks.build-userlib-riscv64]
description = "Build user libraries (RISC-V, debug)"
dependencies = ["build-userlib-debug-riscv64"]

[tasks.build-userlib-aarch64]
description = "Build user libraries (AArch64, debug)"
dependencies = ["build-userlib-debug-aarch64"]

[tasks.build-userbin-debug-riscv64]
description = "Build user programs for RISC-V in debug mode"
cwd = "user/bin"
command = "cargo"
args = ["make", "build"]
dependencies = ["build-userlib-debug-riscv64"]

[tasks.build-userbin-debug-aarch64]
description = "Build user programs for AArch64 in debug mode"
cwd = "user/bin"
command = "cargo"
args = ["make", "build-aarch64"]
dependencies = ["build-userlib-debug-aarch64"]

[tasks.build-userbin-release-riscv64]
description = "Build user programs for RISC-V in release mode"
cwd = "user/bin"
command = "cargo"
args = ["make", "build-release"]
dependencies = ["build-userlib-release-riscv64"]

[tasks.build-userbin-release-aarch64]
description = "Build user programs for AArch64 in release mode"
cwd = "user/bin"
command = "cargo"
args = ["make", "build-release-aarch64"]
dependencies = ["build-userlib-release-aarch64"]

[tasks.build-userbin-riscv64]
description = "Build user programs (RISC-V, debug)"
dependencies = ["build-userbin-debug-riscv64"]

[tasks.build-userbin-aarch64]
description = "Build user programs (AArch64, debug)"
dependencies = ["build-userbin-debug-aarch64"]

[tasks.clean]
description = "Clean all build artifacts"
dependencies = ["clean-kernel", "clean-bsp-riscv64", "clean-bsp-aarch64", "clean-userlib", "clean-userbin", "clean-initramfs", "clean-rootfs", "clean-boot-image-riscv64", "clean-boot-image-aarch64"]

[tasks.clean-kernel]
description = "Clean kernel build artifacts"
cwd = "kernel"
command = "cargo"
args = ["clean"]

[tasks.clean-bsp-riscv64]
description = "Clean RISC-V BSP build artifacts"
cwd = "bsp/riscv64-limine"
command = "cargo"
args = ["clean"]

[tasks.clean-bsp-aarch64]
description = "Clean AArch64 BSP build artifacts"
cwd = "bsp/aarch64-limine"
command = "cargo"
args = ["clean"]

[tasks.clean-userlib]
description = "Clean user library build artifacts"
cwd = "user/lib"
command = "cargo"
args = ["make", "clean"]

[tasks.clean-userbin]
description = "Clean user program build artifacts"
cwd = "user/bin"
command = "cargo"
args = ["clean"]

[tasks.test-riscv64]
description = "Run tests (RISC-V)"
dependencies = ["test-kernel-riscv64"]

[tasks.test-aarch64]
description = "Run tests (AArch64)"
dependencies = ["test-kernel-aarch64"]

[tasks.test-kernel-riscv64]
description = "Run kernel tests (RISC-V)"
cwd = "kernel"
env = { "CARGO_TARGET_RISCV64GC_UNKNOWN_NONE_ELF_RUNNER" = "tools/test.sh" }
command = "cargo"
args = ["test", "--target", "targets/riscv64gc-unknown-none-elf.json"]
dependencies = ["build-initramfs-debug-riscv64"]

[tasks.test-kernel-aarch64]
description = "Run kernel tests (AArch64)"
cwd = "kernel"
env = { "CARGO_TARGET_AARCH64_UNKNOWN_NONE_ELF_RUNNER" = "tools/test_aarch64.sh" }
command = "cargo"
args = ["test", "--target", "targets/aarch64-unknown-none-elf.json"]
dependencies = ["build-initramfs-debug-aarch64"]

[tasks.run-riscv64]
description = "Run the kernel in release mode (RISC-V)"
cwd = "bsp/riscv64-limine"
command = "cargo"
args = ["run", "--release", "--target", "../../kernel/targets/riscv64gc-unknown-none-elf.json"]
dependencies = ["build-release-riscv64"]

[tasks.run-aarch64]
description = "Run the kernel in release mode (AArch64)"
cwd = "bsp/aarch64-limine"
command = "cargo"
args = ["run", "--release", "--target", "../../kernel/targets/aarch64-unknown-none-elf.json"]
dependencies = ["build-release-aarch64"]

[tasks.run-debug-riscv64]
description = "Run the kernel in debug mode (RISC-V)"
cwd = "bsp/riscv64-limine"
command = "cargo"
args = ["run", "--target", "../../kernel/targets/riscv64gc-unknown-none-elf.json"]
dependencies = ["build-debug-riscv64"]

[tasks.run-debug-aarch64]
description = "Run the kernel in debug mode (AArch64)"
cwd = "bsp/aarch64-limine"
command = "cargo"
args = ["run", "--target", "../../kernel/targets/aarch64-unknown-none-elf.json"]
dependencies = ["build-debug-aarch64"]

[tasks.debug-riscv64]
description = "Run the kernel in debug mode (RISC-V)"
cwd = "bsp/riscv64-limine"
command = "./tools/run.sh"
args = ["--debug", "target/riscv64gc-unknown-none-elf/debug/scarlet"]
dependencies = ["build-debug-riscv64"]

[tasks.debug-aarch64]
description = "Run the kernel in debug mode (AArch64)"
cwd = "bsp/aarch64-limine"
command = "./tools/run_aarch64.sh"
args = ["--debug", "target/aarch64-unknown-none-elf/debug/scarlet"]
dependencies = ["build-debug-aarch64"]

[tasks.debug-test-riscv64]
description = "Run kernel tests in debug mode with gdb (RISC-V)"
cwd = "kernel"
env = { "CARGO_TARGET_RISCV64GC_UNKNOWN_NONE_ELF_RUNNER" = "tools/test.sh" }
command = "cargo"
args = ["test", "--", "--debug"]
dependencies = ["build-initramfs-debug-riscv64"]

[tasks.debug-test-aarch64]
description = "Run kernel tests in debug mode with gdb (AArch64)"
cwd = "kernel"
env = { "CARGO_TARGET_AARCH64_UNKNOWN_NONE_ELF_RUNNER" = "tools/test_aarch64.sh" }
command = "cargo"
args = ["test", "--target", "targets/aarch64-unknown-none-elf.json", "--", "--debug"]
dependencies = ["build-initramfs-debug-aarch64"]

[tasks.doc-riscv64]
description = "Generate documentation for all components (RISC-V)"
dependencies = ["doc-kernel", "doc-userlib"]

[tasks.doc-aarch64]
description = "Generate documentation for all components (AArch64)"
dependencies = ["doc-kernel", "doc-userlib"]

[tasks.doc-kernel]
description = "Generate kernel documentation"
cwd = "kernel"
command = "cargo"
args = ["doc", "--no-deps", "--document-private-items"]

[tasks.doc-userlib]
description = "Generate user library documentation"
cwd = "user/lib"
command = "cargo"
args = ["make", "doc"]

[tasks.build-initramfs-debug-aarch64]
description = "Create AArch64 initramfs archive (debug)"
cwd = "mkfs"
command = "sh"
args = ["make_initramfs.sh", "aarch64"]
dependencies = ["build-userbin-debug-aarch64"]

[tasks.build-initramfs-aarch64]
description = "Create AArch64 initramfs archive (debug)"
dependencies = ["build-initramfs-debug-aarch64"]

[tasks.build-initramfs-debug-riscv64]
description = "Create RISC-V initramfs archive (debug)"
cwd = "mkfs"
command = "sh"
args = ["make_initramfs.sh", "riscv64"]
dependencies = ["build-userbin-debug-riscv64"]

[tasks.build-initramfs-riscv64]
description = "Create RISC-V initramfs archive (debug)"
dependencies = ["build-initramfs-debug-riscv64"]

[tasks.build-initramfs-release-aarch64]
description = "Create AArch64 initramfs archive (release)"
cwd = "mkfs"
command = "sh"
args = ["make_initramfs.sh", "aarch64"]
dependencies = ["build-userbin-release-aarch64"]

[tasks.build-initramfs-release-riscv64]
description = "Create RISC-V initramfs archive (release)"
cwd = "mkfs"
command = "sh"
args = ["make_initramfs.sh", "riscv64"]
dependencies = ["build-userbin-release-riscv64"]

[tasks.build-boot-image-riscv64]
description = "Create boot image (RISC-V, debug kernel)"
cwd = "mkfs"
command = "sh"
args = ["make_limine_riscv64_image.sh"]
dependencies = ["build-kernel-debug-riscv64", "build-initramfs-debug-riscv64", "build-rootfs-riscv64"]

[tasks.build-boot-image-riscv64-release]
description = "Create boot image (RISC-V, release kernel)"
cwd = "mkfs"
command = "sh"
args = ["make_limine_riscv64_image.sh"]
env = { "KERNEL_ELF" = "../bsp/riscv64-limine/target/riscv64gc-unknown-none-elf/release/scarlet" }
dependencies = ["build-kernel-release-riscv64", "build-initramfs-release-riscv64", "build-rootfs-riscv64"]

[tasks.build-boot-image-aarch64]
description = "Create boot image (AArch64, debug kernel)"
cwd = "mkfs"
command = "sh"
args = ["make_limine_aarch64_image.sh"]
dependencies = ["build-kernel-debug-aarch64", "build-initramfs-debug-aarch64", "build-rootfs-aarch64"]

[tasks.build-boot-image-aarch64-release]
description = "Create boot image (AArch64, release kernel)"
cwd = "mkfs"
command = "sh"
args = ["make_limine_aarch64_image.sh"]
env = { "KERNEL_ELF" = "../bsp/aarch64-limine/target/aarch64-unknown-none-elf/release/scarlet" }
dependencies = ["build-kernel-release-aarch64", "build-initramfs-release-aarch64", "build-rootfs-aarch64"]

[tasks.clean-initramfs]
description = "Clean initramfs archive"
cwd = "mkfs"
command = "sh"
args = ["clean_initramfs.sh"]

[tasks.build-rootfs-riscv64]
description = "Create rootfs.img if it doesn't exist (RISC-V)"
cwd = "mkfs"
command = "sh"
args = ["make_rootfs.sh"]
condition = { files_not_exist = ["dist/rootfs.img"] }

[tasks.build-rootfs-aarch64]
description = "Create rootfs.img if it doesn't exist (AArch64)"
cwd = "mkfs"
command = "sh"
args = ["make_rootfs.sh"]
condition = { files_not_exist = ["dist/rootfs.img"] }

[tasks.clean-rootfs]
description = "Clean rootfs.img"
cwd = "mkfs"
command = "sh"
args = ["clean_rootfs.sh"]

[tasks.clean-boot-image-riscv64]
description = "Clean boot image artifacts (RISC-V)"
cwd = "mkfs"
command = "sh"
args = ["clean_limine_riscv64.sh"]

[tasks.clean-boot-image-aarch64]
description = "Clean boot image artifacts (AArch64)"
cwd = "mkfs"
command = "sh"
args = ["clean_limine_aarch64.sh"]

[tasks.clippy-fix-riscv64]
description = "Run clippy with auto-fix for all components (RISC-V)"
dependencies = ["clippy-fix-kernel", "clippy-fix-bsp-riscv64", "clippy-fix-userlib", "clippy-fix-userbin"]

[tasks.clippy-fix-aarch64]
description = "Run clippy with auto-fix for all components (AArch64)"
dependencies = ["clippy-fix-kernel", "clippy-fix-bsp-aarch64", "clippy-fix-userlib", "clippy-fix-userbin"]

[tasks.clippy-fix-kernel]
description = "Run clippy with auto-fix for kernel"
cwd = "kernel"
command = "cargo"
args = ["clippy", "--fix", "--allow-dirty", "--allow-staged", "--", "-D", "warnings", "-W", "unused_imports", "-W", "empty_line_after_doc_comments"]

[tasks.clippy-fix-bsp-riscv64]
description = "Run clippy with auto-fix for RISC-V BSP"
cwd = "bsp/riscv64-limine"
command = "cargo"
args = ["clippy", "--fix", "--target", "../../kernel/targets/riscv64gc-unknown-none-elf.json", "--allow-dirty", "--allow-staged", "--", "-D", "warnings"]

[tasks.clippy-fix-bsp-aarch64]
description = "Run clippy with auto-fix for AArch64 BSP"
cwd = "bsp/aarch64-limine"
command = "cargo"
args = ["clippy", "--fix", "--target", "../../kernel/targets/aarch64-unknown-none-elf.json", "--allow-dirty", "--allow-staged", "--", "-D", "warnings"]

[tasks.clippy-fix-userlib]
description = "Run clippy with auto-fix for user libraries"
cwd = "user/lib"
command = "cargo"
args = ["make", "clippy-fix"]

[tasks.clippy-fix-userbin]
description = "Run clippy with auto-fix for user programs"
cwd = "user/bin"
command = "cargo"
args = ["make", "clippy-fix"]

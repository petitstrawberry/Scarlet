command = "sh"
args = ["make_limine_aarch64_image.sh"]
dependencies = ["build-kernel-debug-aarch64", "build-initramfs-debug-aarch64", "build-rootfs-aarch64"]

[tasks.build-boot-image-aarch64-microvm]
description = "Create boot image (AArch64 microvm, debug kernel)"
command = "cargo"
args = ["run", "--manifest-path", "cargo-scarlet/Cargo.toml", "--", "image", "--project", "projects/aarch64-limine-microvm"]
dependencies = ["build-userbin-debug-aarch64"]

[tasks.build-boot-image-aarch64-release]
description = "Create boot image (AArch64, release kernel)"
cwd = "mkfs"
command = "sh"
args = ["make_limine_aarch64_image.sh"]
env = { "KERNEL_ELF" = "../projects/aarch64-limine-full/target/aarch64-unknown-none-elf/release/scarlet" }
dependencies = ["build-kernel-release-aarch64", "build-initramfs-release-aarch64", "build-rootfs-aarch64"]

[tasks.build-boot-image-aarch64-microvm-release]
description = "Create boot image (AArch64 microvm, release kernel)"
dependencies = ["image-aarch64-microvm"]

[tasks.clean-initramfs]
description = "Clean initramfs archive"
cwd = "mkfs"
command = "sh"
args = ["clean_initramfs.sh"]

[tasks.build-rootfs-riscv64]
description = "Create rootfs.img if it doesn't exist (RISC-V)"
cwd = "mkfs"
command = "sh"
args = ["make_rootfs.sh"]
condition = { files_not_exist = ["dist/rootfs.img"] }

[tasks.build-rootfs-aarch64]
description = "Create rootfs.img if it doesn't exist (AArch64)"
cwd = "mkfs"
command = "sh"
args = ["make_rootfs.sh"]
condition = { files_not_exist = ["dist/rootfs.img"] }

[tasks.clean-rootfs]
description = "Clean rootfs.img"
cwd = "mkfs"
command = "sh"
args = ["clean_rootfs.sh"]

[tasks.clean-boot-image-riscv64]
description = "Clean boot image artifacts (RISC-V)"
cwd = "mkfs"
command = "sh"
args = ["clean_limine_riscv64.sh"]

[tasks.clean-boot-image-aarch64]
description = "Clean boot image artifacts (AArch64)"
cwd = "mkfs"
command = "sh"
args = ["clean_limine_aarch64.sh"]

[tasks.clippy-fix-riscv64]
description = "Run clippy with auto-fix for all components (RISC-V)"
dependencies = ["clippy-fix-kernel", "clippy-fix-project-riscv64", "clippy-fix-userlib", "clippy-fix-userbin"]

[tasks.clippy-fix-aarch64]
description = "Run clippy with auto-fix for all components (AArch64)"
dependencies = ["clippy-fix-kernel", "clippy-fix-project-aarch64", "clippy-fix-userlib", "clippy-fix-userbin"]

[tasks.clippy-fix-kernel]
description = "Run clippy with auto-fix for kernel"
cwd = "kernel"
command = "cargo"
args = ["clippy", "--fix", "--allow-dirty", "--allow-staged", "--", "-D", "warnings", "-W", "unused_imports", "-W", "empty_line_after_doc_comments"]

[tasks.clippy-fix-project-riscv64]
description = "Run clippy with auto-fix for RISC-V project"
cwd = "projects/riscv64-limine-full"
command = "cargo"
args = ["clippy", "--fix", "--target", "../../kernel/targets/riscv64gc-unknown-none-elf.json", "--allow-dirty", "--allow-staged", "--", "-D", "warnings"]

[tasks.clippy-fix-project-aarch64]
description = "Run clippy with auto-fix for AArch64 project"
cwd = "projects/aarch64-limine-full"
command = "cargo"
args = ["clippy", "--fix", "--target", "../../kernel/targets/aarch64-unknown-none-elf.json", "--allow-dirty", "--allow-staged", "--", "-D", "warnings"]

[tasks.clippy-fix-userlib]
description = "Run clippy with auto-fix for user libraries"
cwd = "user/lib"
command = "cargo"
args = ["make", "clippy-fix"]

[tasks.clippy-fix-userbin]
description = "Run clippy with auto-fix for user programs"
cwd = "user/bin"
command = "cargo"
args = ["make", "clippy-fix"]

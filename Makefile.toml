[env]
# Environment variable settings for build
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true
CARGO_MAKE_WORKSPACE_INCLUDE_MEMBERS = ["kernel", "projects/riscv64-limine-full/bsp", "projects/aarch64-limine-full/bsp", "projects/aarch64-limine-microvm/bsp", "user/lib/std", "user/bin", "user/video_player", "user/std-bin"]

[config]
default_task = "build-riscv64"
skip_core_tasks = true

[tasks.fmt]
description = "Format all code"
dependencies = ["fmt-kernel", "fmt-project-riscv64", "fmt-project-aarch64", "fmt-project-aarch64-microvm", "fmt-userlib", "fmt-userbin", "fmt-video-player", "fmt-userbin-std", "fmt-drivers", "fmt-modules"]

[tasks.fmt-check]
description = "Check formatting (no changes)"
dependencies = ["fmt-kernel-check", "fmt-project-riscv64-check", "fmt-project-aarch64-check", "fmt-project-aarch64-microvm-check", "fmt-userlib-check", "fmt-userbin-check", "fmt-video-player-check", "fmt-userbin-std-check", "fmt-drivers-check", "fmt-modules-check"]

[tasks.fmt-kernel-check]
description = "Check kernel formatting"
cwd = "kernel"
command = "cargo"
args = ["fmt", "--", "--check"]

[tasks.fmt-project-riscv64-check]
description = "Check RISC-V project formatting"
cwd = "projects/riscv64-limine-full/bsp"
command = "cargo"
args = ["fmt", "--", "--check"]

[tasks.fmt-project-aarch64-check]
description = "Check AArch64 project formatting"
cwd = "projects/aarch64-limine-full/bsp"
command = "cargo"
args = ["fmt", "--", "--check"]

[tasks.fmt-project-aarch64-microvm-check]
description = "Check AArch64 microvm project formatting"
cwd = "projects/aarch64-limine-microvm/bsp"
command = "cargo"
args = ["fmt", "--", "--check"]

[tasks.fmt-userlib-check]
description = "Check user library formatting by calling sub Makefile.toml"
cwd = "user/lib"
command = "cargo"
args = ["make", "fmt-check"]

[tasks.fmt-userbin-check]
description = "Check user program formatting"
cwd = "user/bin"
command = "cargo"
args = ["make", "fmt-check"]

[tasks.fmt-video-player-check]
description = "Check video_player formatting"
cwd = "user/video_player"
command = "cargo"
args = ["make", "fmt-check"]

[tasks.fmt-userbin-std-check]
description = "Check Rust std user program formatting"
cwd = "user/std-bin"
command = "cargo"
args = ["make", "fmt-check"]

[tasks.fmt-drivers-check]
description = "Check external driver formatting"
script = '''
for dir in $(find drivers -name Cargo.toml -exec dirname {} \;); do
  echo "Checking $dir"
  cargo fmt --manifest-path "$dir/Cargo.toml" -- --check || exit 1
done
'''

[tasks.fmt-modules-check]
description = "Check external module formatting"
script = '''
for dir in $(find modules -name Cargo.toml -exec dirname {} \;); do
  echo "Checking $dir"
  cargo fmt --manifest-path "$dir/Cargo.toml" -- --check || exit 1
done
'''

[tasks.clippy-riscv64]
description = "Run clippy for all components (RISC-V)"
dependencies = ["clippy-kernel", "clippy-project-riscv64", "clippy-userlib", "clippy-userbin", "clippy-video-player"]

[tasks.clippy-aarch64]
description = "Run clippy for all components (AArch64)"
dependencies = ["clippy-kernel", "clippy-project-aarch64", "clippy-userlib", "clippy-userbin", "clippy-video-player"]

[tasks.clippy-kernel]
description = "Run clippy for kernel"
cwd = "kernel"
command = "cargo"
args = ["clippy", "--", "-D", "warnings"]

[tasks.clippy-project-riscv64]
description = "Run clippy for RISC-V project"
command = "cargo"
args = ["scarlet", "clippy", "--project", "projects/riscv64-limine-full"]

[tasks.clippy-project-aarch64]
description = "Run clippy for AArch64 project"
command = "cargo"
args = ["scarlet", "clippy", "--project", "projects/aarch64-limine-full"]

[tasks.clippy-project-aarch64-microvm]
description = "Run clippy for AArch64 microvm project"
command = "cargo"
args = ["scarlet", "clippy", "--project", "projects/aarch64-limine-microvm"]

[tasks.clippy-userlib]
description = "Run clippy for user libraries by calling sub Makefile.toml"
cwd = "user/lib"
command = "cargo"
args = ["make", "clippy"]

[tasks.clippy-userbin]
description = "Run clippy for user programs by calling sub Makefile.toml"
cwd = "user/bin"
command = "cargo"
args = ["make", "clippy"]

[tasks.clippy-video-player]
description = "Run clippy for video_player"
cwd = "user/video_player"
command = "cargo"
args = ["make", "clippy"]
[tasks.fmt-kernel]
description = "Format kernel code"
cwd = "kernel"
command = "cargo"
args = ["fmt"]

[tasks.fmt-project-riscv64]
description = "Format RISC-V project code"
cwd = "projects/riscv64-limine-full/bsp"
command = "cargo"
args = ["fmt"]

[tasks.fmt-project-aarch64]
description = "Format AArch64 project code"
cwd = "projects/aarch64-limine-full/bsp"
command = "cargo"
args = ["fmt"]

[tasks.fmt-project-aarch64-microvm]
description = "Format AArch64 microvm project code"
cwd = "projects/aarch64-limine-microvm/bsp"
command = "cargo"
args = ["fmt"]

[tasks.fmt-userlib]
description = "Format user library code"
cwd = "user/lib"
command = "cargo"
args = ["make", "fmt"]

[tasks.fmt-userbin]
description = "Format user program code"
cwd = "user/bin"
command = "cargo"
args = ["make", "fmt"]

[tasks.fmt-video-player]
description = "Format video_player code"
cwd = "user/video_player"
command = "cargo"
args = ["make", "fmt"]

[tasks.fmt-userbin-std]
description = "Format Rust std user program code"
cwd = "user/std-bin"
command = "cargo"
args = ["make", "fmt"]

[tasks.fmt-drivers]
description = "Format external driver code"
script = '''
for dir in $(find drivers -name Cargo.toml -exec dirname {} \;); do
  echo "Formatting $dir"
  cargo fmt --manifest-path "$dir/Cargo.toml"
done
'''

[tasks.fmt-modules]
description = "Format external module code"
script = '''
for dir in $(find modules -name Cargo.toml -exec dirname {} \;); do
  echo "Formatting $dir"
  cargo fmt --manifest-path "$dir/Cargo.toml"
done

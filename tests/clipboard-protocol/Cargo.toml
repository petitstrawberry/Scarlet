[package]
name = "scarlet-clipboard-checks"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["std"]
std = []
server = ["dep:framebuffer", "dep:gpu-raw", "dep:scarlet-ui-renderer-sgfx", "dep:sgfx", "dep:png", "dep:sbus-client", "dep:scarlet-desktop-config", "dep:sws-remote-protocol", "dep:scarlet-os", "dep:scarlet-sys"]

[dependencies]
sws-protocol = { path = "../../user/lib/sws-protocol", default-features = false, features = ["std"] }

[target.'cfg(target_os = "scarlet")'.dependencies]
sws-client = { path = "../../user/lib/sws-client", default-features = false, features = ["std"] }
framebuffer = { path = "../../user/lib/framebuffer", default-features = false, features = ["std"], optional = true }
gpu-raw = { path = "../../user/lib/gpu-raw", default-features = false, features = ["std"], optional = true }
scarlet-os = { path = "../../user/lib/scarlet-os", default-features = false, features = ["std"], optional = true }
scarlet-sys = { path = "../../user/lib/scarlet-sys", optional = true }
scarlet-ui-renderer-sgfx = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "775e42f502f4e150bb614bbe2c1ed76d46530484", optional = true }
sgfx = { git = "https://github.com/petitstrawberry/sgfx", rev = "5cb1fb27596af49d54cb33851e553249de8230a9", default-features = false, features = ["std", "backend-dynamic", "backend-wgpu"], optional = true }
png = { version = "0.18.1", optional = true }
sbus-client = { path = "../../user/lib/sbus-client", default-features = false, features = ["std"], optional = true }
scarlet-desktop-config = { path = "../../user/lib/scarlet-desktop-config", default-features = false, features = ["std"], optional = true }
sws-remote-protocol = { path = "../../user/lib/sws-remote-protocol", default-features = false, features = ["std"], optional = true }

[lib]
path = "lib.rs"

[[test]]
name = "wire-contract"
path = "../../user/lib/sws-protocol/tests/wire_contract.rs"

[[bin]]
name = "sws"
path = "../../user/std-bin/src/sws/main.rs"
required-features = ["server"]

[patch."https://github.com/petitstrawberry/Scarlet"]
scarlet-abi = { path = "../../user/lib/scarlet-abi" }
scarlet-os = { path = "../../user/lib/scarlet-os" }
scarlet-rt = { path = "../../user/lib/scarlet-rt" }
scarlet-std = { path = "../../user/lib/std" }
scarlet-sys = { path = "../../user/lib/scarlet-sys" }
gpu-raw = { path = "../../user/lib/gpu-raw" }
sws-client = { path = "../../user/lib/sws-client" }
sws-protocol = { path = "../../user/lib/sws-protocol" }

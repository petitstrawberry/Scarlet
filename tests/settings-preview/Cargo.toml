[package]
name = "scarlet-settings-view-preview"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "7d266bd8c66605c41185f637934ca6b451261a50", default-features = false, features = ["std", "platform-winit"] }
scarlet-ui-macros = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "7d266bd8c66605c41185f637934ca6b451261a50" }
scarlet-desktop-config = { path = "../../user/lib/scarlet-desktop-config", default-features = false, features = ["std"] }

[[bin]]
name = "settings-preview"
path = "main.rs"

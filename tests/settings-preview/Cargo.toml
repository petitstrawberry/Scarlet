[package]
name = "scarlet-settings-view-preview"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "4802af3f0191dbd6a13d0293fc63670fcb346f61", default-features = false, features = ["std", "platform-winit"] }
scarlet-ui-macros = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "4802af3f0191dbd6a13d0293fc63670fcb346f61" }
scarlet-desktop-config = { path = "../../user/lib/scarlet-desktop-config", default-features = false, features = ["std"] }

[[bin]]
name = "settings-preview"
path = "main.rs"

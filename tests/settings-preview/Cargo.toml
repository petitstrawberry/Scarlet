[package]
name = "scarlet-settings-view-preview"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "bff4e31975798a7b86446ac82f240d46f195f112", default-features = false, features = ["std", "platform-winit"] }
scarlet-ui-macros = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "bff4e31975798a7b86446ac82f240d46f195f112" }
scarlet-desktop-config = { path = "../../user/lib/scarlet-desktop-config", default-features = false, features = ["std"] }

[[bin]]
name = "settings-preview"
path = "main.rs"

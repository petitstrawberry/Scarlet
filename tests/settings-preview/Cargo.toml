[package]
name = "scarlet-settings-view-preview"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "7056bd9f79b2547f46d80509bfe34339babbb369", default-features = false, features = ["std", "platform-winit"] }
scarlet-ui-macros = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "7056bd9f79b2547f46d80509bfe34339babbb369" }
scarlet-desktop-config = { path = "../../user/lib/scarlet-desktop-config", default-features = false, features = ["std"] }

[[bin]]
name = "settings-preview"
path = "main.rs"
